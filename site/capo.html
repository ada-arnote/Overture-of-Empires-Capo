<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12171a">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>Capo</title>
<link rel="stylesheet" href="table.css">
<link rel="icon" href="data:,">
<style>
body.story { overflow: auto; height: auto; min-height: 100% }
.story main { max-width: 760px; margin: 0 auto; padding: 22px 16px 80px }
.story h1 { font-size: clamp(40px, 7vw, 64px); margin: 8px 0 6px }
.story h2 { font: 500 22px/1.2 var(--serif); margin: 18px 0 8px }
.story .panel { padding: 16px; margin-bottom: 14px }
.story label.field-line { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; color: var(--soft); font-size: 14px }
.story select, .story input[type=text], .story input[type=password], .story textarea { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: #20282a; color: var(--text); font: inherit }
.story textarea { width: 100%; resize: vertical }
.tabs { position: sticky; top: 0; z-index: 3; display: flex; gap: 4px; overflow-x: auto; padding: 8px 0; background: linear-gradient(#12171a 80%, transparent) }
.tabs button { flex: none; min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 244, 214, .05) }
.tabs button[aria-selected=true] { border-color: var(--gold); background: rgba(226, 184, 102, .17) }
.status { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--soft); margin-bottom: 8px } .status b { color: var(--text) }
.feed { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px }
.feed li { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: rgba(255, 244, 214, .04) }
.feed .when { color: var(--gold); font-size: 13px } .feed .why { color: var(--soft); font-size: 13px; margin-top: 4px }
.feed li.held { opacity: .55 } .feed li.letter { border-color: var(--line2); font-style: italic }
.orders { list-style: none; padding: 0; display: grid; gap: 6px; margin: 8px 0 }
.orders li { display: flex; gap: 8px; align-items: flex-start } .orders li span { flex: 1; padding-top: 10px }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 }
.chips button, .small { min-height: 38px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--line); background: rgba(255, 244, 214, .05); font-size: 14px }
.grid { width: 100%; border-collapse: collapse; font-size: 14px } .grid th, .grid td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line) } .grid th { color: var(--soft); font-weight: 600 }
.member { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 8px } .member.trusted { border-color: var(--gold) }
.member .row { display: flex; flex-wrap: wrap; gap: 6px }
.note { color: var(--soft); font-size: 14px }
.paste { width: 100%; min-height: 160px; font-size: 13px }
.receipt { font-size: 13px; color: var(--soft); padding-left: 18px }
.warn { color: #f2a08c }
</style>
</head>
<body class="story">
<main id="app">
  <p class="eyebrow">Overture of Empires</p>
  <h1>Capo</h1>
  <p class="tag">The story game: you lead a country, an AI tells the story, and the rules keep the facts. An early test build.</p>
  <div id="view"></div>
</main>
<dialog id="sheet" class="panel" aria-labelledby="sheet-title"><h2 id="sheet-title"></h2><div id="sheet-body"></div><div class="go"><button type="button" class="main" id="sheet-close">Close</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<footer id="foot" style="display:flex;position:static;justify-content:center"><span id="version"></span><span id="source"></span><span>AGPL-3.0</span></footer>
<script type="module" src="capo.js"></script>
</body>
</html>
