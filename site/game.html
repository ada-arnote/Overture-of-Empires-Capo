<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12171a">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'">
<title>Capo</title>
<link rel="stylesheet" href="table.css">
<link rel="icon" href="data:,">
<style>
html, body { height: 100%; margin: 0; overflow: hidden }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block }
#map:active { cursor: grabbing }
.glass { background: rgba(16, 21, 24, .9); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(6px) }
button.plain { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 244, 214, .05); color: var(--text); font: inherit; font-size: 14px }
button.plain[aria-pressed=true] { border-color: var(--gold); background: rgba(226, 184, 102, .17) }
button.go { min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--gold); background: var(--gold); color: #1a1408; font-weight: 700 }
select.plain, input.plain, textarea.plain { min-height: 40px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line2); background: #1c2426; color: var(--text); font: inherit; font-size: 14px }
textarea.plain { width: 100%; box-sizing: border-box; resize: vertical }
#top { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 6px 8px; z-index: 4 }
#top .who { display: flex; gap: 8px; align-items: center; font: 500 18px/1.1 var(--serif, Georgia, serif); background: none; border: 0; color: var(--text); padding: 0 4px; min-height: 40px }
#top .chip { width: 16px; height: 16px; border-radius: 4px; border: 1px solid rgba(255, 244, 214, .5) }
#top .mode { font-size: 12px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line2); color: var(--soft) }
#top .date { margin-left: auto; font-size: 14px; color: var(--soft) } #top .date b { color: var(--text) }
#dock { position: fixed; left: 8px; bottom: 10px; display: flex; gap: 6px; padding: 6px; z-index: 4; flex-wrap: wrap; max-width: calc(100vw - 70px) }
#sheet { position: fixed; left: 8px; top: 72px; bottom: 70px; width: min(430px, calc(100vw - 16px)); padding: 14px; overflow: auto; z-index: 5; display: none; box-sizing: border-box }
#sheet.open { display: block }
#sheet h2 { margin: 0 0 8px; font: 500 22px/1.2 var(--serif, Georgia, serif) } #sheet h3 { margin: 14px 0 6px; font: 600 15px/1.2 inherit }
#sheet .shut { float: right }
.note { color: var(--soft); font-size: 14px; margin: 6px 0 }
.warn { color: #f2a08c; font-size: 14px }
.list { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 6px }
.list li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px } .list li span { flex: 1 }
.feed { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px }
.feed li { padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255, 244, 214, .03) }
.feed .when { color: var(--gold); font-size: 13px; background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted }
.feed p { margin: 4px 0 0 }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 }
.paste { min-height: 130px; font-size: 12px }
#card { position: fixed; right: 64px; bottom: 10px; width: min(330px, calc(100vw - 80px)); padding: 12px 14px; z-index: 4; display: none }
#card h2 { margin: 0 0 4px; font: 500 20px/1.2 var(--serif, Georgia, serif) }
#card .near { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px } #card .near button { min-height: 30px; padding: 0 8px; font-size: 13px }
.zoom { position: fixed; right: 8px; bottom: 10px; display: grid; gap: 6px; z-index: 4 }
.zoom button { min-width: 44px; min-height: 44px; font-size: 18px }
#start { position: fixed; left: 8px; top: 8px; bottom: 8px; width: min(470px, calc(100vw - 16px)); display: none; z-index: 6; overflow: auto }
#start.open { display: block }
#start .box { padding: 18px 20px; min-height: 100%; box-sizing: border-box }
#start h1 { margin: 0; font: 500 clamp(40px, 8vw, 60px)/1 var(--serif, Georgia, serif) }
#start label { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; color: var(--soft); font-size: 14px }
.modes { display: grid; gap: 6px } #start .modes label { flex-direction: row; align-items: flex-start; gap: 8px; margin: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--text) } .modes small { display: block; color: var(--soft) }
#toast { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); z-index: 7 }
.credit { position: fixed; right: 64px; bottom: 2px; font-size: 10px; color: var(--soft); opacity: .6; z-index: 3 }
@media (max-width: 640px) { #top .date { margin-left: 0; width: 100% } #dock { flex-wrap: nowrap; overflow-x: auto; right: 62px; max-width: none } #dock button { flex: none } #sheet { top: auto; height: 60vh; bottom: 68px } #card { right: 8px; bottom: 68px; width: calc(100vw - 16px); box-sizing: border-box } #toast { top: 150px } }
</style>
</head>
<body>
<canvas id="map" aria-label="The world map. Drag to move, scroll or pinch to zoom, tap a province to see it."></canvas>
<header id="top" class="glass" hidden></header>
<nav id="dock" class="glass" aria-label="Game" hidden></nav>
<aside id="sheet" class="glass" aria-live="polite"></aside>
<section id="card" class="glass" aria-live="polite"></section>
<div class="zoom"><button type="button" class="plain" id="in" aria-label="Zoom in">+</button><button type="button" class="plain" id="out" aria-label="Zoom out">&minus;</button><button type="button" class="plain" id="home" aria-label="Back to my country">&#8962;</button></div>
<div id="start"><div class="box glass" id="start-box"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<span id="homelink" hidden><a href="./" class="text">All games</a></span>
<span class="credit">Made with Natural Earth</span>
<script type="module" src="game.js"></script>
</body>
</html>
