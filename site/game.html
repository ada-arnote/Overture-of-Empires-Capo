<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0d1623">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self' https://openrouter.ai https://api.groq.com https://api.openai.com https://api.anthropic.com https://generativelanguage.googleapis.com https://api.mistral.ai https://api.deepseek.com https://api.together.xyz https://api.cerebras.ai http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'">
<title>Capo, the story game · Overture of Empires: Capo</title>
<link rel="stylesheet" href="table.css">
<link rel="icon" href="icons/tent/mark.svg">
<script src="source.js"></script>
<style>
html, body { height: 100%; margin: 0; overflow: hidden }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block }
#map:active { cursor: grabbing }
/* surfaces, buttons, fields and marks come from table.css (.glass, .paper, .plain, .go, .ic, svg.i), as in the table games; below is only what belongs to Capo */

/* top bar: who you are, when it is, and the turn's one big button */
#top { position: fixed; top: 0; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; padding: max(6px, env(safe-area-inset-top)) 8px 6px; border-top: 0; border-radius: 0 0 var(--r-3) var(--r-3); border-bottom-color: var(--edge); z-index: 4 }
#top .who { display: flex; gap: 10px; align-items: center; font: 400 22px/1.1 var(--display); background: none; border: 0; color: var(--text); padding: 0 6px; min-height: var(--tap) }
#top .chip { width: 14px; height: 14px; border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 0 2px var(--edge) }
#top .mode { font: 700 var(--fs-1)/1 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; padding: 5px 9px; border-radius: var(--r-1); border: 1px solid var(--edge); color: var(--text-2) }
#top .mode.sandbox { border-color: var(--danger); color: var(--danger) }
#top .date { margin-left: auto; display: grid; justify-items: end; line-height: 1.15 } #top .date b { font: 700 var(--fs-3)/1.2 var(--sans); color: var(--text) } #top .date small { color: var(--text-3); font-size: var(--fs-1) }
#top button.go { min-height: var(--tap-lg); padding: 0 20px; font-size: 17px }
/* with no AI, a quiet way to connect one beside Advance (ruling 151) */
button.connect { min-height: var(--tap); padding: 0 6px; border: 0; background: none; color: var(--text-2); font-size: var(--fs-2); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: .2em; white-space: nowrap } button.connect:hover { color: var(--text) }

/* the dock: five places, each with its own mark */
#dock { position: fixed; left: 8px; bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 5px; z-index: 4; max-width: calc(100vw - 70px) }
#dock button { position: relative; display: grid; justify-items: center; gap: 2px; min-width: 74px; min-height: var(--tap-lg); padding: 6px 8px 5px; border-radius: var(--r-1); border: 1px solid transparent; border-bottom: 3px solid transparent; background: none; color: var(--text-3); font-size: var(--fs-1) }
#dock button:hover { color: var(--text); background: var(--raise) }
#dock button[aria-pressed=true] { color: var(--text); border-bottom-color: var(--accent); background: var(--accent-wash) }
#dock .dot { position: absolute; top: 5px; right: 16px; width: 9px; height: 9px; margin: 0; background: var(--accent); box-shadow: 0 0 0 2px var(--halo) }

/* the open panel */
#sheet { position: fixed; left: 8px; top: 70px; bottom: 82px; width: min(440px, calc(100vw - 16px)); padding: 0 16px 16px; overflow: auto; z-index: 5; display: none; box-sizing: border-box; background: var(--slate); scrollbar-width: thin; scrollbar-color: var(--edge) transparent }
#sheet.open { display: block }
#sheet .head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 -16px 8px; padding: 10px 12px 8px 16px; background: var(--slate); border-bottom: 1px solid var(--edge-soft) }
#sheet h2 { margin: 0; font-size: 26px; line-height: 1.2 }
#sheet h3, #start h3 { margin: 18px 0 6px; font: 700 var(--fs-1)/1.2 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) }
.note { color: var(--text-3); font-size: var(--fs-2); margin: 6px 0 }
.warn { color: var(--danger); font-size: var(--fs-2) }
.list { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 6px }
.list li { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--edge-soft); border-radius: var(--r-1) } .list li span { flex: 1 }
.list li.yes { border-left: 3px solid var(--good) } .list li.no { border-left: 3px solid var(--danger); color: var(--text-3) }
.list li .mark { flex: none; font-weight: 700 } .list li.yes .mark { color: var(--good) } .list li:is(.no, .lost) .mark { color: var(--danger) } .list li.lost { border-left: 3px solid var(--danger) } .list li.news .mark { color: var(--text-3) }
.feed { list-style: none; padding: 0; margin: 8px 0; display: grid; gap: 8px }
.feed li { padding: 11px 13px; border: 1px solid var(--edge-soft); border-left: 3px solid var(--c, var(--accent)); border-radius: var(--r-1); background: var(--raise) }
.feed .when { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-size: var(--fs-1); background: none; border: 0; padding: 0; cursor: pointer }
.feed p { margin: 4px 0 0; font: 16px/1.5 var(--serif) }
.feed b { font: 400 19px/1.3 var(--display) }
.row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 }

/* keyless hook (site/keyless.js): the gazette, what waits for an answer, the ambition in the top bar, the endings */
.gazette { margin: 10px 0 12px; padding: 14px 16px 12px; border: 1px solid var(--edge-soft); border-top: 3px double var(--accent); border-radius: var(--r-1); background: var(--raise) }
.gazette .masthead { margin: 0 0 4px; padding-bottom: 8px; border-bottom: 1px solid var(--edge-soft) } .gazette .masthead b { font: 400 22px/1.2 var(--display); margin-right: 4px } .gazette .masthead small { display: block; margin-top: 3px; color: var(--text-3); font-size: var(--fs-1) }
.gazette h3 { margin: 12px 0 2px !important } .gazette p { margin: 4px 0 0; font: 17px/1.55 var(--serif); color: var(--text) }
.press { display: flex; gap: 10px; align-items: center; margin: 6px 0; padding: 8px 10px; border: 1px solid var(--edge); border-left: 3px solid var(--danger); border-radius: var(--r-1) } .press span { flex: 1 }
details.why { margin: 12px 0 } details.why summary { cursor: pointer; min-height: var(--tap); display: flex; align-items: center; color: var(--accent); font-size: var(--fs-2) } details.why summary::before { content: "+"; display: inline-block; width: 1.1em; font-weight: 700 } details.why[open] summary::before { content: "\2212" }
#top .amb { display: inline-grid; gap: 3px; min-height: var(--tap); padding: 4px 10px; border: 1px solid var(--edge); border-radius: var(--r-1); background: none; color: var(--text-2); font-size: var(--fs-1); text-align: left; max-width: 240px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis } #top .amb:hover { color: var(--text) } #top .amb.ask { border-color: var(--accent); color: var(--accent) }
#top .amb .short { display: none } #top .amb .meter { display: block; height: 4px; border-radius: 2px; background: var(--edge-soft); overflow: hidden } #top .amb .meter i { display: block; height: 100%; background: var(--accent) }
dialog.ending { border-top: 4px double var(--accent); text-align: left } dialog.ending.lost { border-top-color: var(--danger) } dialog.ending .eyebrow { margin: 0 0 4px; font: 700 var(--fs-1)/1.2 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) } dialog.ending.lost .eyebrow { color: var(--danger) }
dialog.ending h2 { font: 400 34px/1.1 var(--display); margin: 0 0 10px; outline: 0 } dialog.ending h3 { margin: 16px 0 6px; font: 700 var(--fs-1)/1.2 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) } dialog.ending li { font-size: var(--fs-2); color: var(--text-2); margin-bottom: 4px }
dialog.ending .stack button { text-align: left; padding: 8px 12px; height: auto; white-space: normal } dialog.ending .stack small { color: var(--text-3) }

/* AI wiring (p5-ai, site/ai.js) */
.aipanel .field { display: grid; gap: 4px } .connectbox .aipanel { margin-top: 8px } .connectbox { scroll-margin-top: 64px } /* clear of the sheet's sticky head */ .choices { border: 0; padding: 0; display: grid; gap: 4px }
/* guide hook: Choose an AI (site/aiguide.js) */
@media (min-width: 821px) { dialog.aiguide { width: min(620px, calc((100vw - 32px) / var(--ui-scale))); max-height: min(calc(88vh / var(--ui-scale)), 820px) } }
.aiguide { overflow-wrap: anywhere } .aiguide h3 { margin: 18px 0 6px; font: 700 var(--fs-1)/1.2 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) } .aiguide h4 { margin: 10px 0 4px; font-size: var(--fs-2) }
.aiguide .route { border: 1px solid var(--edge-soft); border-radius: var(--r-1); margin: 6px 0; padding: 0 12px } .aiguide .route[open] { padding-bottom: 6px; background: var(--raise) }
.aiguide summary { min-height: var(--tap); padding: 8px 0; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; list-style: none } .aiguide summary::-webkit-details-marker { display: none } .aiguide summary .note { margin: 0 }
.aiguide summary::before { content: "+"; width: 1em; color: var(--accent); font-weight: 700 } .aiguide .route[open] > summary::before { content: "\2212" } .aiguide .guide-close:first-child { margin-top: -10px }
.aiguide ol { padding-left: 22px } .aiguide a { color: var(--accent-hi); display: inline-flex; align-items: center; min-height: var(--tap); overflow-wrap: anywhere }
.aiguide dt { font-weight: 700; margin-top: 8px } .aiguide dd { margin: 2px 0 0 14px } .aiguide .guide-close { justify-content: flex-end }
.stream { max-height: 9em; overflow: auto; white-space: pre-wrap; font-size: var(--fs-1); color: var(--text-2) }

/* the province card */
#card { position: fixed; right: 64px; bottom: max(10px, env(safe-area-inset-bottom)); width: min(340px, calc(100vw - 80px)); padding: 13px 15px; z-index: 4; display: none }
#card h2 { margin: 0 0 4px; font-size: 24px; line-height: 1.2 } #card > .shut { float: right; position: sticky; top: 0; z-index: 1; margin: -6px -8px 0 6px }
#card .near { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px } #card .near button { padding: 0 10px; font-size: var(--fs-1) }
.zoom { left: auto; right: 8px; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 4 }
#view { position: fixed; right: 8px; top: 74px; z-index: 4; background: var(--lacquer); backdrop-filter: blur(10px) }

/* the first screen */
#start { position: fixed; left: 8px; top: 8px; bottom: 8px; width: min(480px, calc(100vw - 16px)); display: none; z-index: 6; overflow: auto }
#start.open { display: block } #start.open ~ .play-h { display: none } /* the first screen has its own h1 */
#start.min { top: auto; bottom: 8px; overflow: visible } #start.min .box { min-height: 0; padding: 10px 14px }
#start .box { padding: 20px 22px; min-height: 100%; box-sizing: border-box; background: var(--slate) }
#start h1 { margin: 6px 0 10px; font-size: clamp(48px, 8vw, 68px); line-height: 1 } #start h1 + .row { flex-wrap: nowrap } #start h1 + .row button { flex: 1 1 auto; padding: 0 6px }
#start label { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; color: var(--text-3); font-size: var(--fs-2) }
.modes { display: grid; gap: 6px } #start .modes label { flex-direction: row; align-items: flex-start; gap: 10px; margin: 0; padding: 10px 12px; border: 1px solid var(--edge-soft); border-radius: var(--r-1); color: var(--text); background: var(--raise) }
#start .modes label:has(input:checked) { border-color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent) } .modes small { display: block; color: var(--text-3) } .modes input { accent-color: var(--accent) }

/* the guide: a paper note, like the table games' coach */
#guide { position: fixed; z-index: 9; width: min(330px, calc(100vw - 24px)); padding: 14px 16px; display: none; border-radius: var(--r-1); box-shadow: var(--lift-3) }
#guide.open { display: block }
#guide h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.2 } #guide p { margin: 0 0 10px; font: 16px/1.45 var(--serif) }
#guide .count { color: var(--text-3); font-size: var(--fs-1); margin-right: auto }
.lit { position: relative; z-index: 8 !important; box-shadow: 0 0 0 3px #f6f8fb, 0 0 0 9999px rgba(var(--shade), .6) !important }

#toast { top: 76px; z-index: 7 }
.credit { position: fixed; right: 64px; bottom: 2px; font-size: 11px; color: var(--text-3); opacity: .7; z-index: 3 }
@media (max-width: 640px) {
  #start h1 + .row button { font-size: var(--fs-1) }
  /* two lines: who you are, the date and the menu; then how you play, the length and Advance */
  #top { left: 0; right: 0; border-radius: 0; gap: 6px 8px } #top::before { content: ""; order: 1; flex-basis: 100%; margin-top: -6px }
  #top .who { min-width: 0; font-size: 20px } #top :is(.mode, select, input, button.connect, button.go) { order: 2 }
  #top .amb { padding: 2px 6px; flex: none; min-height: 32px; align-content: center } #top .amb .long { display: none } #top .amb .short { display: inline } #top .who { flex: 0 1 auto; overflow: hidden; white-space: nowrap; text-overflow: ellipsis } #top .date b { font-size: var(--fs-2) } /* keyless hook: the ambition stays on the first line */
  #top .mode { margin: 0 auto 0 6px } #top select.plain { flex: 0 1 auto; min-width: 0; max-width: 29vw } #top button.go { min-height: var(--tap); padding: 0 12px; gap: 4px }
  #dock { left: 0; right: 0; bottom: 0; max-width: none; padding: 4px 4px max(4px, env(safe-area-inset-bottom)); border-radius: 0; border-width: 1px 0 0; } #dock button { flex: 1 1 0; min-width: 0; padding: 6px 2px 5px; line-height: 1.1 }
  #sheet { left: 0; top: auto; width: 100vw; height: 60vh; bottom: 70px; border-radius: var(--r-3) var(--r-3) 0 0 } #card { right: 8px; bottom: 78px; width: calc(100vw - 16px); box-sizing: border-box }
  .zoom { bottom: 78px } .credit { bottom: 72px; right: 8px }
  #toast { top: 116px; bottom: auto } /* keyless hook: the shared phone rule pins the bottom too, which stretched the toast over the Ledger */ #view { top: auto; bottom: 232px }
  #guide { left: 12px !important; right: 12px; bottom: 80px !important; top: auto !important; width: auto }
}
</style>
</head>
<body>
<header id="top" class="glass" hidden></header>
<nav id="dock" class="glass" aria-label="Game" hidden></nav>
<main>
<canvas id="map" aria-label="The world map. Drag to move, scroll or pinch to zoom, tap a province to see it."></canvas>
<aside id="sheet" class="glass" aria-label="Panel"></aside>
<section id="card" class="glass" aria-label="Province"></section>
<select id="view" class="plain" aria-label="Map view"><option value="countries">Map: countries</option><option value="relations">Map: friends and foes</option><option value="might">Map: might</option><option value="state">Map: stability</option></select>
<div class="zoom"><button type="button" class="plain" id="in" aria-label="Zoom in">+</button><button type="button" class="plain" id="out" aria-label="Zoom out">&minus;</button><button type="button" class="plain" id="home" aria-label="Back to my country">&#8962;</button><button type="button" class="plain" id="relief" aria-label="Relief map with pieces. Press for the flat map." aria-pressed="true" hidden>&#9651;</button></div>
<div id="start"><div class="box glass" id="start-box"></div></div>
<h1 class="sr play-h">Capo, the story game</h1>
</main>
<section id="guide" class="paper" role="dialog" aria-live="polite" aria-label="Guide"></section>
<div id="toast" role="status" aria-live="polite"></div>
<span id="homelink" hidden><a href="./" class="text">All games</a></span>
<span class="credit">Made with Natural Earth. Ecoregions 2017 © RESOLVE, CC BY 4.0</span>
<script type="module" src="game.js"></script>
</body>
</html>
