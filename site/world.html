<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#12171a">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>Capo world map</title>
<link rel="stylesheet" href="table.css">
<link rel="icon" href="data:,">
<style>
html, body { height: 100%; margin: 0; overflow: hidden }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block }
#map:active { cursor: grabbing }
.bar { position: fixed; top: 10px; left: 10px; right: 10px; display: flex; gap: 8px; align-items: center; pointer-events: none }
.bar > * { pointer-events: auto }
.bar .mapname { padding: 8px 14px; border-radius: 12px; background: rgba(18, 23, 26, .86); border: 1px solid var(--line); font: 500 18px/1.2 var(--serif, Georgia, serif) }
.bar input { min-height: 40px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(18, 23, 26, .9); color: var(--text); font: inherit; width: min(260px, 40vw) }
.zoom { position: fixed; right: 10px; bottom: 16px; display: grid; gap: 6px }
.zoom button, .bar button { min-width: 44px; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: rgba(18, 23, 26, .9); color: var(--text); font-size: 18px }
#card { position: fixed; left: 10px; bottom: 16px; max-width: min(360px, calc(100vw - 80px)); padding: 12px 14px; border-radius: 14px; background: rgba(18, 23, 26, .92); border: 1px solid var(--line); display: none }
#card h2 { margin: 0 0 4px; font: 500 20px/1.2 var(--serif, Georgia, serif) } #card p { margin: 4px 0; color: var(--soft); font-size: 14px }
#card .near { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px } #card .near button { min-height: 32px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--line); background: rgba(255, 244, 214, .05); color: var(--text); font-size: 13px }
#note { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--soft) }
@media (max-width: 560px) { .bar .mapname { display: none } .bar input { width: 100% } }
.credit { position: fixed; right: 64px; bottom: 6px; font-size: 11px; color: var(--soft); opacity: .7 }
</style>
</head>
<body>
<canvas id="map" aria-label="World map of provinces. Drag to move, scroll or pinch to zoom, tap a province to see it."></canvas>
<div class="bar"><span class="mapname">Capo: the world map</span><input id="find" type="search" placeholder="Find a province or country" aria-label="Find a province or country" list="names"><datalist id="names"></datalist></div>
<div class="zoom"><button type="button" id="in" aria-label="Zoom in">+</button><button type="button" id="out" aria-label="Zoom out">&minus;</button><button type="button" id="home" aria-label="Whole world">&#8962;</button></div>
<section id="card" aria-live="polite"></section>
<p id="note">Loading the map...</p>
<span class="credit">Made with Natural Earth</span>
<script type="module" src="world.js"></script>
</body>
</html>
