<title>Capo world map</title>
<style>
/* SPDX-License-Identifier: AGPL-3.0-or-later */
/* Every game screen takes its look from this file: the four table games, Capo and the world map.
   1. Tokens: colour, type, space, shape, depth, motion. 2. Materials. 3. Components. 4. The table games' layout.
   The rule of three materials: LACQUER (dark, a silver keyline) is what floats over the map and stays; PAPER is what you
   pick up and read (a dispatch, a card, the rules, a lesson); SILVER is the one main action in view and the mark of what is chosen.
   Blue and silver (the owner, 26 November): no gold. Warm colour belongs to the seats and the boards alone. */

/* ---- 1. tokens ---- */
@font-face { font-family: "Tent Roman"; src: url("../site/fonts/tent-roman/tent-roman.woff2") format("woff2"); font-display: swap }
@font-face { font-family: "Spectral"; src: url("../site/fonts/spectral/spectral-400.woff2") format("woff2"); font-display: swap }
@font-face { font-family: "Atkinson Hyperlegible"; src: url("../site/fonts/atkinson/atkinson-400.woff2") format("woff2"); font-display: swap }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../site/fonts/atkinson/atkinson-700.woff2") format("woff2"); font-display: swap }
:root {
  /* colour, by role: the front page's night chart (docs/design/modern-site/direction.md). Daylight first; lamplight below. Both are the tent's
     dark blue (ruling 126), a brighter and a deeper one, so seat colours read the same. Three grounds: the room, the deep HUD, the raised sheet */
  --ground: #22364f; --ground-2: #2b4263; --lacquer: rgba(22, 37, 58, .9); --slate: #2b4263; --shade: 15, 26, 42;
  --text: #eef1f5; --text-2: #c9d1da; --text-3: #adb8c4;
  --edge: rgba(214, 224, 236, .5); --edge-soft: rgba(214, 224, 236, .16); --raise: rgba(214, 224, 236, .07); --sheen: rgba(214, 224, 236, .07);
  --accent: #dfe5ec; --accent-hi: #f6f8fb; --accent-lo: #6f7f93; --accent-wash: rgba(214, 224, 236, .15); --on-accent: #0f1a2a;
  --paper: #e9edf2; --paper-edge: #9aa7b6; --paper-ink: #142033; --paper-soft: #44526a; --paper-accent: #2b4263;
  --danger: #f0a08c; --danger-wash: rgba(240, 160, 140, .16); --good: #9fd08a; --win: var(--accent-hi); --lose: #8ea3bd;
  --focus: #f6f8fb; --halo: #0a121e; --seat: var(--accent); --pattern: rgba(16, 12, 10, .42);
  /* type: a display roman for names and headings (18 px and up, never bold), a reading serif, a plain face for labels and numbers */
  --display: "Tent Roman", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --serif: "Spectral", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fs-1: 13px; --fs-2: 14px; --fs-3: 16px; --fs-4: 18px; --fs-5: 22px; --fs-6: 28px; --fs-7: 40px; --caps: .14em;
  /* space, shape, depth, motion */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --tap: 44px; --tap-lg: 50px;
  --r-1: 4px; --r-2: 6px; --r-3: 10px;
  --lift-1: 0 1px 4px rgba(0, 0, 0, .3); --lift-2: 0 6px 20px rgba(0, 0, 0, .34); --lift-3: 0 18px 50px rgba(0, 0, 0, .5); /* only for what floats over a map; elsewhere a lighter ground and a hairline do the lifting */
  --t-1: .12s; --t-2: .2s; --t-3: .32s; --t-4: .6s; --ease: cubic-bezier(.2, .8, .2, 1);
  --ui-scale: 1; --banner-time: .9s;
  /* the names older rules used, kept so nothing written against them breaks */
  --table: var(--ground); --table2: var(--ground-2); --panel: var(--lacquer); --line: var(--edge-soft); --line2: var(--edge); --soft: var(--text-3); --gold: var(--accent); --gold2: var(--accent-hi); --on: var(--on-accent);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #0f1a2a; --ground-2: #162539; --lacquer: rgba(10, 18, 30, .9); --slate: #162539; --shade: 6, 11, 19; --text: #e6eaef; --text-2: #b9c2cc; --text-3: #9ba7b4; --edge: rgba(205, 216, 229, .45); --edge-soft: rgba(205, 216, 229, .13); --accent: #d3dbe4; --accent-hi: #eef2f6; --paper: #cdd5de; --paper-edge: #8794a4 } }
:root[data-theme="dark"] { --ground: #0f1a2a; --ground-2: #162539; --lacquer: rgba(10, 18, 30, .9); --slate: #162539; --shade: 6, 11, 19; --text: #e6eaef; --text-2: #b9c2cc; --text-3: #9ba7b4; --edge: rgba(205, 216, 229, .45); --edge-soft: rgba(205, 216, 229, .13); --accent: #d3dbe4; --accent-hi: #eef2f6; --paper: #cdd5de; --paper-edge: #8794a4 }

* { box-sizing: border-box; margin: 0 }
[hidden] { display: none !important }
html, body { height: 100%; overflow: hidden }
body { background: radial-gradient(120% 90% at 50% 42%, var(--ground-2), var(--ground) 72%); color: var(--text); font: var(--fs-3)/1.45 var(--sans); -webkit-tap-highlight-color: transparent }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer; touch-action: manipulation }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 5px var(--halo) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

/* ---- 2. materials ---- */
.panel, .glass, .seat, #toast { background: var(--lacquer); border: 1px solid var(--edge-soft); border-top-color: var(--edge); border-radius: var(--r-2); box-shadow: var(--lift-2), inset 0 1px 0 var(--sheen); backdrop-filter: blur(12px) saturate(1.1); -webkit-backdrop-filter: blur(12px) saturate(1.1) }
dialog.panel { background: var(--slate); border-color: var(--edge); box-shadow: var(--lift-3), inset 0 1px 0 var(--sheen) }
/* paper rebinds the roles, so every component laid on it turns to ink without a rule of its own */
.paper, #news, #coach, #hand > * {
  --text: var(--paper-ink); --text-2: var(--paper-ink); --text-3: var(--paper-soft); --edge: rgba(20, 32, 51, .6); --edge-soft: rgba(20, 32, 51, .24); --raise: rgba(20, 32, 51, .06); --sheen: transparent;
  --accent: var(--paper-accent); --accent-hi: var(--paper-accent); --accent-wash: rgba(43, 66, 99, .14); --focus: var(--paper-ink); --halo: var(--paper); --danger: #8f2b22;
  background: var(--paper); color: var(--text); border: 1px solid var(--paper-edge); backdrop-filter: none; -webkit-backdrop-filter: none; color-scheme: light;
}

/* ---- 3. components ---- */
/* buttons: one silver plate a view (.main, Capo's .go), lacquer for the rest (.quiet, .plain), words alone (.text), a mark alone (.icon, .ic) */
.main, .quiet, button.plain, button.go, .pick button { min-height: var(--tap); border-radius: var(--r-1); border: 1px solid var(--edge); transition: background var(--t-1), border-color var(--t-1), filter var(--t-1) }
.main, .quiet { min-height: var(--tap-lg); padding: 0 var(--sp-4); font-weight: 700; letter-spacing: .01em }
.main, button.go { background: linear-gradient(#f8fafc, #d6dee7 55%, #b4c1cf); border-color: #6f7f93; color: #0f1a2a; font-weight: 700; box-shadow: 0 2px 0 rgba(0, 0, 0, .4), inset 0 1px 0 #fff }
.main { flex: 1 }
.main:hover, button.go:hover { filter: brightness(1.07) } .main:active, button.go:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3) }
.main:disabled, button.go:disabled { background: none; border: 1px dashed var(--edge); color: var(--text-3); box-shadow: none; filter: none; transform: none; cursor: default; font-weight: 400 }
.main small { font-weight: 400; opacity: .8 }
.quiet, button.plain, .pick button { background: var(--raise); color: var(--text) } .quiet:hover, button.plain:hover, .pick button:hover:not(:disabled) { background: var(--accent-wash) }
.quiet:disabled { opacity: .45; cursor: default }
.quiet.danger { border-color: var(--danger); color: var(--danger) } .danger[data-armed] { background: var(--danger-wash) }
a.quiet { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; color: inherit }
button.plain { padding: 0 var(--sp-3); font-size: var(--fs-2) } button.go { display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--sp-4) }
.text { background: none; border: 0; padding: 12px 4px; min-height: var(--tap); color: var(--text-2); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--edge) } .text:hover { color: var(--accent-hi) }
.icon, button.ic { flex: none; display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: var(--r-1); background: none; color: var(--text) }
button.ic { border: 1px solid var(--edge-soft); background: var(--raise) }
.icon:hover, button.ic:hover { background: var(--accent-wash) }
.icon svg, svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block }
/* chosen: a bright edge, a bar under it and heavier words, so it never rests on colour alone; the system's own mark when colours are forced */
[aria-pressed=true]:is(button.plain, .pick button, .wear-row button), .pick [aria-checked=true] { border-color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent), inset 0 -4px 0 var(--accent); font-weight: 700 }
@media (forced-colors: active) { [aria-checked=true], [aria-pressed=true] { outline: 3px solid Highlight; outline-offset: -3px } }
/* a row of buttons wraps before it runs off the panel; the main one takes what is left, or a row of its own */
.go { display: flex; flex-wrap: wrap; gap: var(--sp-2) } .go > .quiet { flex: 0 1 auto; white-space: nowrap } .go > .main { flex: 1 1 9em; padding: 4px var(--sp-3); line-height: 1.15; text-wrap: balance }
/* choices in a row: one control, arrows move in it */
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px }
.pick.even > * { flex: 1 }
.pick button { min-height: 46px; padding: 6px 13px; line-height: 1.15; text-align: center }
.pick button:disabled { cursor: default; color: var(--text-3); border-style: dashed }
.pick small { display: block; color: var(--text-3); font-size: var(--fs-1) } .pick [aria-checked=true] small { color: var(--text-2) }
.pick.small { margin: 0 } .pick.small button { min-height: var(--tap); min-width: var(--tap) }
.strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; padding: 2px 2px 5px; margin-inline: -2px }
.strip > * { flex: none; white-space: nowrap }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); transform: rotate(45deg) }
/* tabs: words on a rule, the chosen one underlined in silver */
.pick.tabs { flex-wrap: nowrap; gap: 0; margin-bottom: var(--sp-4); border-bottom: 1px solid var(--edge-soft) }
.tabs button { flex: 1; padding: 6px 4px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; color: var(--text-3); font-weight: 700 }
.tabs [aria-checked=true] { background: none; box-shadow: none; border-color: var(--accent); color: var(--text) }
/* zoom, for the board (the table games) and the map (Capo): plus, minus, all of it */
.zoom { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 6px } .zoom button { width: var(--tap); min-width: var(--tap); min-height: var(--tap); padding: 0; font-size: 20px; background: var(--lacquer) }
/* fields */
.field, .paste, select, .plain:is(select, input, textarea) { min-height: var(--tap); padding: 8px 12px; border-radius: var(--r-1); border: 1px solid var(--edge); background: rgba(var(--shade), .55); color: var(--text) }
.paper :is(.field, .paste, select) { background: rgba(255, 255, 255, .35) }
.paste { width: 100%; resize: vertical; font-size: var(--fs-2); word-break: break-all } textarea.plain { width: 100%; resize: vertical; line-height: 1.45 }
input[type=range] { accent-color: var(--accent) }
/* headings and small labels */
h1, h2, .seat b { font-family: var(--display); font-weight: 400 } /* names and headings; its figures are old-style, so anything with a number in it is set in the plain face */
.eyebrow, .seat dt, .ranks tr:first-child th, #turn small, .end h2, .cap { font: 700 var(--fs-1)/1.3 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) }
/* sheets: one at a time, lacquer for the menu and the end, paper for what is read */
dialog { color: var(--text); margin: auto; width: min(480px, calc((100vw - 32px) / var(--ui-scale))); max-height: min(calc(84vh / var(--ui-scale)), 640px); padding: 22px; overflow-y: auto } dialog::backdrop { background: rgba(var(--shade), .66) }
dialog h2 { font-size: var(--fs-6); line-height: 1.15; margin-bottom: var(--sp-3) } dialog p, dialog li { margin-bottom: 9px } dialog ul { padding-left: 20px; margin-bottom: 12px } dialog .stack { display: grid; gap: var(--sp-2); margin-bottom: 14px }
dialog.paper :is(p, li) { font-family: var(--serif); font-size: 17px; line-height: 1.5 }
dialog .stack button { min-height: 48px } dialog .go { position: sticky; bottom: -22px; padding-bottom: 4px }
dialog .stack > button canvas { width: 22px; height: 22px; vertical-align: -5px; margin-right: 10px } dialog .stack .go { position: static; padding: 0 }
dialog > .go { background: inherit; margin: 0 -22px -22px; padding: 10px 22px 18px !important; border-top: 1px solid var(--edge-soft) }
dialog.paper > .go { background: var(--paper) }
dialog hr { border: 0; border-top: 1px solid var(--edge); margin: 6px 0 } #sheet-body a { color: var(--accent-hi) }
#sheet.wide { width: min(560px, calc((100vw - 24px) / var(--ui-scale))) }
#log { max-height: 34vh; overflow-y: auto; padding-left: 26px; color: var(--text-2) }
/* words over the board: one line at a time, never in the way */
#toast { position: fixed; z-index: 2; left: 50%; top: 84px; transform: translate(-50%, -8px); max-width: min(520px, calc(100vw - 32px)); padding: 9px 18px; border-left: 3px solid var(--accent); text-align: center; font: var(--fs-3)/1.35 var(--sans); opacity: 0; transition: opacity var(--t-3), transform var(--t-3); pointer-events: none }
#toast.on { opacity: 1; transform: translate(-50%, 0) }

/* ---- 4. the table games ---- */
#stage { position: fixed; inset: 0 }
.board-layer { position: absolute; inset: 0 }
#stage svg { position: absolute; inset: 0; width: 100%; height: 100% }
.shade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--t-4); background: linear-gradient(90deg, rgba(var(--shade), .95) 0, rgba(var(--shade), .78) 36%, rgba(var(--shade), .1) 72%) }
.menu .shade { opacity: 1 }

/* top bar: a plate hung from the top edge. Round, the land held, the goal */
#bar { position: fixed; z-index: 3; top: 0; left: 50%; transform: translateX(-50%); width: min(620px, calc((100vw - 24px) / var(--ui-scale))); display: flex; align-items: center; gap: var(--sp-2); padding: max(6px, env(safe-area-inset-top)) 6px 6px; border-top: 0; border-radius: 0 0 var(--r-3) var(--r-3); border-bottom-color: var(--edge) }
#bar .mid { flex: 1; min-width: 0; padding: 2px 4px 5px }
#round { font: 700 var(--fs-3)/1.3 var(--sans); letter-spacing: .04em; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#land { position: relative; height: 10px; margin-top: 5px; border-radius: 2px; background: var(--raise); box-shadow: 0 0 0 1px var(--edge-soft) }
#fills { display: flex; height: 100%; border-radius: 2px; overflow: hidden }
#fills i { display: block; height: 100%; transition: width .7s cubic-bezier(.3, .7, .3, 1) }
#fills i + i { box-shadow: inset 1px 0 0 rgba(0, 0, 0, .6) }
#goal { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: var(--accent-hi); box-shadow: 0 0 0 1px var(--halo) }

/* seats: a colour bar, the sign, the name, two or three figures. The one to move is keyed in silver */
#seats { position: fixed; z-index: 2; list-style: none; padding: 0; left: max(16px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); width: 208px; display: grid; gap: 10px }
.seat { position: relative; padding: 10px 12px 10px 54px; border-left: 4px solid var(--seat); box-shadow: var(--lift-1); transition: border-color var(--t-2), transform var(--t-2) var(--ease) }
.seat.now { border-color: var(--accent); border-left-color: var(--seat); box-shadow: 0 0 0 1px var(--accent), var(--lift-2); transform: translateX(6px) }
.seat.out { opacity: .5 }
.seat canvas { position: absolute; left: 11px; top: 12px; width: 32px; height: 32px }
.seat b { font-size: 19px; line-height: 1.15; display: block }
.seat small { color: var(--text-3); font-size: var(--fs-1) }
.seat dl { display: flex; gap: 14px; margin: 8px 0 0 -42px; font-variant-numeric: tabular-nums }
.seat dt { color: var(--text-3); letter-spacing: .05em; font-size: 12px; white-space: nowrap } .seat dd { font-weight: 700; font-size: var(--fs-3) }

/* the move: what you can do now. The tray at the bottom of a phone */
#act { position: fixed; z-index: 3; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 340px; padding: 14px 16px 16px }
#status { font: 700 var(--fs-4)/1.25 var(--sans); margin-bottom: 10px; min-height: 1.25em; text-wrap: balance }
#act .quiet { padding: 0 14px } #send + .quiet, #act > .quiet { width: 100%; margin-top: var(--sp-2) }
#choice > .text { display: block; margin: 2px auto -10px; font-size: var(--fs-2) }
#info { color: var(--text-2); font-size: var(--fs-2); min-height: 2.9em; margin-bottom: var(--sp-2) }
#amount { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; min-height: var(--tap) } #much { flex: 1; height: var(--tap) } #many { min-width: 3.2em; text-align: right; font: 700 var(--fs-4)/1 var(--sans); font-variant-numeric: tabular-nums }
#dice { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px } #dice div { display: flex; gap: 4px } #dice svg { width: 30px; height: 30px; display: block; animation: tumble .28s ease-out backwards }
@keyframes tumble { from { transform: rotate(-140deg) scale(.5); opacity: 0 } }
#send p { color: var(--text-2); margin-bottom: 10px }
/* cards in the hand are paper, and big enough to tap */
#hand { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-2) } #hand:empty, #trades:empty { display: none } #hand button, #hand span { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 2px 10px; border-radius: var(--r-1); font-size: var(--fs-2); box-shadow: var(--lift-1) } #hand button { min-height: var(--tap) } #hand svg { width: 16px; height: 16px } #trades { margin-bottom: var(--sp-2) }
.goods { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: var(--sp-2) } .goods span { padding: 3px 9px; border-radius: var(--r-1); background: var(--raise); color: #20221c; font-size: var(--fs-2); font-weight: 700 } .goods span:nth-last-child(-n+2):not([style]) { color: var(--text) }
#live .live-info { color: var(--text-2); font-size: var(--fs-2); margin-bottom: var(--sp-2) } .live-row { display: flex; align-items: center; gap: 10px; margin-bottom: var(--sp-2) } .live-row input { flex: 1; height: var(--tap) } .live-row output { min-width: 3em; text-align: right; font: 700 var(--fs-4)/1 var(--sans) }
#leaders { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 3px; font-size: var(--fs-2) } #leaders li { display: flex; align-items: center; gap: 4px } #leaders b { flex: 1; font-weight: 700 } #leaders li.me b { color: var(--accent-hi) } #live .go button[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
/* since your last turn: a dispatch. One line until it is opened, so it never takes the board */
#news { position: relative; margin-bottom: 10px; padding: 0 44px 0 12px; border-radius: var(--r-1); font-size: var(--fs-2); box-shadow: var(--lift-1) } #news:empty { display: none }
#news .head { display: block; width: 100%; min-height: 40px; padding: 0; border: 0; background: none; text-align: left; font: 700 var(--fs-1)/1.3 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) } #news .head::after { content: " \25BE" } #news .head[aria-expanded=true]::after { content: " \25B4" }
#news ul { padding: 0 0 10px 18px; max-height: 26vh; overflow-y: auto; font-family: var(--serif); font-size: 15px } #news small { display: block; margin: -4px 0 10px; color: var(--text-3) }
#news:not(.open) :is(li + li, small) { display: none } #news:not(.open) ul { list-style: none; padding-left: 0 } #news:not(.open) li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#news .shut { position: absolute; top: 0; right: 0; width: var(--tap); height: 40px; border: 0; background: none; font-size: 22px; color: var(--text-3) }
/* the record of the game, docked beside the board on wide screens */
