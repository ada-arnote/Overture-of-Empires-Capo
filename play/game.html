<style>
/* SPDX-License-Identifier: AGPL-3.0-or-later */
:root {
  --table: #12171a; --table2: #1f2a2c; --panel: rgba(19, 24, 26, .84); --line: rgba(236, 222, 186, .16); --line2: rgba(236, 222, 186, .34);
  --text: #f1e9d6; --soft: #b9b29f; --gold: #e2b866; --gold2: #f4d795; --on: #1b1510;
  color-scheme: dark;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --sans: system-ui, "Segoe UI", Roboto, sans-serif;
  /* the shell's own: text size (set from Settings), the turn banner, the end sheet, danger, seat patterns */
  --ui-scale: 1; --seat: var(--gold); --banner-time: .9s; --win: var(--gold2); --lose: #a9bccd; --danger: #e08a72; --pattern: rgba(16, 12, 10, .42);
}
* { box-sizing: border-box; margin: 0 }
[hidden] { display: none !important }
html, body { height: 100%; overflow: hidden }
body { background: radial-gradient(120% 90% at 50% 42%, var(--table2), var(--table) 72%); color: var(--text); font: 16px/1.45 var(--sans); -webkit-tap-highlight-color: transparent }
button, select { font: inherit; color: inherit }
button { cursor: pointer; touch-action: manipulation }
:focus-visible { outline: 3px solid var(--gold2); outline-offset: 2px }
#stage { position: fixed; inset: 0 }
.board-layer { position: absolute; inset: 0 }
#stage svg { position: absolute; inset: 0; width: 100%; height: 100% }
.shade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .6s; background: linear-gradient(90deg, rgba(10, 13, 14, .93) 0, rgba(10, 13, 14, .72) 36%, rgba(10, 13, 14, .12) 72%) }
.menu .shade { opacity: 1 }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 14px 40px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 244, 214, .06); backdrop-filter: blur(14px) saturate(1.1); -webkit-backdrop-filter: blur(14px) saturate(1.1) }

/* top bar */
#bar { position: fixed; z-index: 3; top: max(12px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(620px, calc(100vw - 24px)); display: flex; align-items: center; gap: 8px; padding: 6px }
#bar .mid { flex: 1; min-width: 0; padding: 2px 4px 5px }
#round { font: 600 15px/1.3 var(--serif); text-align: center; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.icon { flex: none; width: 44px; height: 44px; border: 0; border-radius: 10px; background: none }
.icon:hover { background: rgba(255, 244, 214, .08) }
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block; margin: auto }
#land { position: relative; height: 10px; margin-top: 6px; border-radius: 5px; background: rgba(255, 244, 214, .13) }
#fills { display: flex; height: 100%; border-radius: 5px; overflow: hidden }
#fills i { display: block; height: 100%; transition: width .7s cubic-bezier(.3, .7, .3, 1) }
#fills i + i { box-shadow: inset 1px 0 0 rgba(0, 0, 0, .6) }
#goal { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--gold2); border-radius: 1px }

/* seats */
#seats { position: fixed; z-index: 2; list-style: none; padding: 0; left: max(16px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); width: 208px; display: grid; gap: 10px }
.seat { position: relative; padding: 11px 14px 11px 52px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); transition: border-color .25s, transform .25s; backdrop-filter: blur(12px) }
.seat.now { border-color: var(--gold); transform: translateX(6px) }
.seat.out { opacity: .5 }
.seat canvas { position: absolute; left: 12px; top: 13px; width: 30px; height: 30px }
.seat b { font: 600 17px/1.2 var(--serif); display: block }
.seat small { color: var(--soft); font-size: 13px }
.seat dl { display: flex; gap: 14px; margin-top: 4px; font-variant-numeric: tabular-nums }
.seat dt { font-size: 12px; color: var(--soft) } .seat dd { font-weight: 650; font-size: 16px }

/* the move */
#act { position: fixed; z-index: 3; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 340px; padding: 14px 16px 16px }
#status { font: 600 18px/1.3 var(--serif); margin-bottom: 10px; min-height: 1.3em; text-wrap: balance }
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px }
.pick.even > * { flex: 1 }
.pick button { min-height: 46px; padding: 6px 13px; border-radius: 10px; border: 1px solid var(--line2); background: rgba(255, 244, 214, .05); line-height: 1.15; text-align: center }
.pick button:hover { border-color: var(--line2) }
.pick button[aria-checked=true] { border-color: var(--gold); background: rgba(226, 184, 102, .17); box-shadow: inset 0 0 0 1px var(--gold) }
.pick button:disabled { cursor: default; color: var(--soft); border-style: dashed }
.pick small { display: block; color: var(--soft); font-size: 13px }
.pick.small { margin: 0 } .pick.small button { min-height: 44px; min-width: 44px }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 7px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5) }
.go { display: flex; gap: 8px }
.main, .quiet { min-height: 50px; padding: 0 18px; border-radius: 11px; border: 1px solid transparent; font-weight: 650 }
.main { flex: 1; background: linear-gradient(#efcb82, #d9a851); color: var(--on); box-shadow: 0 2px 0 rgba(0, 0, 0, .35), inset 0 1px 0 rgba(255, 255, 255, .4) }
.go button { white-space: nowrap } #act .quiet { padding: 0 14px }
.main:hover { filter: brightness(1.06) } .main:active { transform: translateY(1px) }
.main:disabled { filter: grayscale(.8) brightness(.6); cursor: default }
.quiet { background: rgba(255, 244, 214, .06); border-color: var(--line2) } .quiet:hover { background: rgba(255, 244, 214, .12) }
.text { background: none; border: 0; padding: 12px 4px; min-height: 44px; color: var(--soft); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--line2) } .text:hover { color: var(--text) }

.strip { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: thin; padding-bottom: 3px }
.strip > * { flex: none; white-space: nowrap }
.main small { font-weight: 500; opacity: .75 }

/* words over the board */
#toast { position: fixed; z-index: 2; left: 50%; top: 92px; transform: translate(-50%, -8px); max-width: min(520px, calc(100vw - 32px)); padding: 9px 18px; border-radius: 22px; background: var(--panel); border: 1px solid var(--line); text-align: center; font: 500 16px/1.35 var(--serif); opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; backdrop-filter: blur(12px) }
#toast.on { opacity: 1; transform: translate(-50%, 0) }

/* title */
.title { position: fixed; z-index: 4; inset: 0; overflow-y: auto; padding: max(6vh, 28px) 24px 64px max(6vw, 24px); display: flex; flex-direction: column; justify-content: safe center; gap: 14px; max-width: 520px }
.eyebrow { font: 500 14px/1.4 var(--serif); color: var(--gold); letter-spacing: .04em }
h1 { font: 500 clamp(48px, 6vw, 84px)/.92 var(--serif); letter-spacing: -.025em; text-shadow: 0 4px 30px rgba(0, 0, 0, .6) }
.tag { font: 400 19px/1.45 var(--serif); color: #d8cfba; max-width: 24em }
.card { padding: 16px; width: min(420px, 100%) }
.line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap } .line > span { color: var(--soft) }
#who { list-style: none; padding: 0; margin-bottom: 12px; display: grid; gap: 6px }
#who li { display: flex; align-items: center; gap: 10px } #who canvas { width: 28px; height: 28px; flex: none } #who b { font: 600 17px/1 var(--serif) }
.wear { flex: 1; display: flex; align-items: center; gap: 10px; min-height: 44px; border: 0; background: none; padding: 0 4px; border-radius: 10px; text-align: left } .wear:hover { background: rgba(255, 244, 214, .07) }
#who select, .more select { min-height: 44px; padding: 0 10px; border-radius: 10px; border: 1px solid var(--line); background: #20282a }
.links { display: flex; gap: 20px; flex-wrap: wrap }
#foot { position: fixed; z-index: 5; right: 16px; bottom: 10px; display: none; gap: 14px; font-size: 13px; color: var(--soft) } .menu #foot { display: flex } #foot a { color: inherit }
.broken { position: fixed; inset: auto 16px 16px; z-index: 9; padding: 12px 16px; background: #5a2318; border-radius: 10px; opacity: 0; animation: late 0s 2.5s forwards } @keyframes late { to { opacity: 1 } }

dialog { color: inherit; margin: auto; width: min(480px, calc(100vw - 32px)); max-height: min(80vh, 640px); padding: 22px; overflow-y: auto } dialog::backdrop { background: rgba(6, 8, 9, .6) }
dialog h2 { font: 500 28px/1.15 var(--serif); margin-bottom: 12px } dialog p, dialog li { margin-bottom: 9px } dialog ul { padding-left: 20px; margin-bottom: 12px } dialog .stack { display: grid; gap: 8px; margin-bottom: 14px }
dialog .stack button { min-height: 48px } dialog .go { position: sticky; bottom: -22px; padding-bottom: 4px }
#log { max-height: 34vh; overflow-y: auto; padding-left: 26px; color: #d8cfba }
#chart { display: block; width: 100%; height: 120px; margin-bottom: 14px; border-radius: 8px; background: rgba(255, 244, 214, .06) }

@media (max-width: 820px) {
  #seats { top: auto; bottom: auto; left: 12px; right: 12px; width: auto; transform: none; top: calc(max(12px, env(safe-area-inset-top)) + 70px); grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 6px }
  .seat { padding: 7px 4px 7px 36px } .seat canvas { left: 7px; top: 9px; width: 23px; height: 23px } .seat.now { transform: none } .seat b { font-size: 15px } .seat small { display: none } .seat dl { gap: 8px; margin-top: 1px } .seat dt { font-size: 11px } .seat dd { font-size: 15px; line-height: 1.1 } .seat dl div:last-child { display: none }
  #act { left: 8px; right: 8px; bottom: max(8px, env(safe-area-inset-bottom)); width: auto; padding: 12px 12px 12px }
  #status { font-size: 17px; margin-bottom: 8px } .pick { margin-bottom: 8px }
  #toast { top: auto; bottom: calc(var(--act, 290px) + 16px); font-size: 15px; width: max-content }
  .shade { background: linear-gradient(180deg, rgba(10, 13, 14, .35) 0, rgba(10, 13, 14, .82) 24%, rgba(10, 13, 14, .93) 62%) }
  .title { padding: 26px 18px 60px; max-width: none } h1 { font-size: clamp(52px, 17vw, 84px) }
}
@media (max-height: 560px) and (min-width: 821px) { #seats { width: 176px } #act { width: 300px } h1 { font-size: 56px } .seat small { display: none } }
.still * { transition: none !important } /* reduced motion: the system's wish, or the player's in Settings */
.about { margin: -6px 0 12px; font-size: 13px; color: var(--soft) } .about span { display: block } .about span + span { margin-top: 5px } .about span:first-child { color: var(--text) }
#info { color: #d8cfba; font-size: 14px; min-height: 2.9em; margin-bottom: 8px }
#amount { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; min-height: 44px } #much { flex: 1; height: 44px; accent-color: var(--gold) } #many { min-width: 3.2em; text-align: right; font: 600 18px/1 var(--serif); font-variant-numeric: tabular-nums }
#dice { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px } #dice div { display: flex; gap: 4px } #dice svg { width: 30px; height: 30px; display: block }
@keyframes tumble { from { transform: rotate(-140deg) scale(.5); opacity: 0 } } #dice svg { animation: tumble .28s ease-out backwards }
.still #dice svg { animation: none }
@media (max-width: 820px) { #info { min-height: 1.4em; font-size: 13px } #dice svg { width: 26px; height: 26px } }
@media (max-width: 820px) { .seat dl { margin: 7px 0 0 -24px } .seat { overflow: hidden } }
#send p { color: #d8cfba; margin-bottom: 10px } #send + .quiet, #act > .quiet { width: 100%; margin-top: 8px }
.field, .paste { min-height: 44px; padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line2); background: #20282a; color: var(--text); font: inherit } .line .field { width: 190px } .paste { width: 100%; resize: vertical; font-size: 14px; word-break: break-all }
dialog .stack > button canvas { width: 22px; height: 22px; vertical-align: -5px; margin-right: 10px } dialog .stack .go { position: static; padding: 0 }
dialog > .go { background: #161c1e; margin: 0 -22px -22px; padding: 10px 22px 18px !important }
.more:empty { display: none } .more .head { display: block; color: var(--soft); margin-bottom: 6px } .more .pick { margin-bottom: 8px } .more .line { margin-bottom: 8px } .more .about { margin: 0 0 10px; min-height: 0 } .more .about:empty { display: none }
.pick button[aria-pressed=true] { border-color: var(--gold); background: rgba(226, 184, 102, .17); box-shadow: inset 0 0 0 1px var(--gold) }
.wear-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-bottom: 14px } .wear-row button { position: relative; min-height: 52px; border-radius: 10px; border: 1px solid var(--line); background: rgba(255, 244, 214, .05) } .wear-row canvas { width: 34px; height: 34px; display: block; margin: auto } .wear-row [aria-pressed=true] { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold) } .wear-row small { position: absolute; right: 5px; bottom: 2px; color: var(--soft); font-size: 12px }
#hand { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px } #hand button, #hand span { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 2px 9px; border-radius: 8px; border: 1px solid var(--line2); background: #e8dcbd; color: #2a1d14; font-size: 13px } #hand svg { width: 16px; height: 16px } #trades { margin-bottom: 8px } #trades:empty { display: none }
.card { max-height: none }
@media (min-width: 821px) {
  .atlas #seats { left: 50%; top: 84px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); grid-auto-flow: column; gap: 8px }
  .atlas .seat { padding: 7px 14px 7px 44px; min-width: 150px } .atlas .seat canvas { left: 9px; top: 9px; width: 27px; height: 27px } .atlas .seat small { display: none } .atlas .seat dl { margin: 2px 0 0 -34px; gap: 12px } .atlas .seat.now { transform: none }
  .atlas #act { right: auto; left: 16px }
  .atlas #toast { top: 176px }
}
@media (max-width: 820px) { .menu #foot { left: 0; right: 0; bottom: 0; padding: 8px 16px; background: #10161a; justify-content: center } }
#style small { font-size: 11px }
.goods { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px } .goods span { padding: 2px 8px; border-radius: 7px; background: rgba(255, 244, 214, .1); color: #2a1d14; font-size: 13px; font-weight: 600 } .goods span:nth-last-child(-n+2):not([style]) { color: var(--text) }
#live .live-info { color: #d8cfba; font-size: 14px; margin-bottom: 8px } .live-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px } .live-row input { flex: 1; height: 44px; accent-color: var(--gold) } .live-row output { min-width: 3em; text-align: right; font: 600 18px/1 var(--serif) }
#leaders { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 3px; font-size: 14px } #leaders li { display: flex; align-items: center; gap: 4px } #leaders b { flex: 1; font-weight: 600 } #leaders li.me b { color: var(--gold2) } #live .go button[aria-pressed=true] { border-color: var(--gold) }
@media (max-width: 820px) { #leaders { grid-template-columns: 1fr 1fr; font-size: 13px } }
#quick { min-height: 58px; font-size: 20px } #preset { margin: 10px 0 4px } #own > summary { min-height: 44px; display: flex; align-items: center; color: var(--soft); cursor: pointer } #own[open] > summary { margin-bottom: 8px } #own .go > * { flex: 1 }
#news { position: relative; margin-bottom: 10px; padding: 8px 40px 8px 12px; border-radius: 10px; background: rgba(255, 244, 214, .08); font-size: 14px; color: #d8cfba } #news:empty { display: none } #news b { font: 600 15px var(--serif); color: var(--text) } #news ul { padding-left: 18px } #news small { color: var(--soft) }
#news button, #dock .head { border: 0; background: none } #news button { position: absolute; top: 0; right: 0; width: 44px; height: 44px; font-size: 22px; color: var(--soft) }
#dock { position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right)); top: 86px; width: 340px; max-height: calc(100vh - var(--ah, 300px) - 116px); display: flex; flex-direction: column; padding: 2px 4px 8px } .atlas #dock { top: 180px }
#dock .head { min-height: 40px; padding: 0 12px; text-align: left; font: 600 15px var(--serif); color: var(--soft) } #dock .head::after { content: " \25B4" } #dock [aria-expanded=false]::after { content: " \25BE" }
#dock ol { overflow-y: auto; padding: 0 12px 0 34px; font-size: 14px; color: #d8cfba } #dock li + li { margin-top: 3px }
@media (min-width: 1181px) { #logs { display: none } }

/* text size: the floating parts grow together, and widths are divided back so nothing leaves the screen */
#bar, #seats, #act, #dock, #toast, #sheet, #turn, .title .card, .title .links { zoom: var(--ui-scale) }
#bar { width: min(620px, calc((100vw - 24px) / var(--ui-scale))) }
dialog { width: min(480px, calc((100vw - 32px) / var(--ui-scale))); max-height: min(calc(84vh / var(--ui-scale)), 640px) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }

/* the turn banner: in, held, gone in under a second; a fade when motion is reduced */
#turn { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; margin: auto; width: max-content; max-width: calc((100vw - 24px) / var(--ui-scale)); display: grid; grid-template-columns: auto auto; column-gap: 16px; align-items: center; padding: 10px 30px 10px 14px; border-radius: 14px; background: var(--panel); border: 2px solid var(--seat); border-left-width: 12px; box-shadow: 0 14px 40px rgba(0, 0, 0, .5); backdrop-filter: blur(14px); pointer-events: none }
#turn canvas { grid-row: 1 / span 3; width: 60px; height: 60px }
#turn small { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--soft) }
#turn b { font: 600 30px/1.05 var(--serif) } #turn span { font: 500 17px/1.3 var(--serif); color: var(--gold2) }
#turn.go { animation: turn-in var(--banner-time) cubic-bezier(.2, .8, .2, 1) both } .still #turn.go { animation-name: turn-fade }
@keyframes turn-in { from { transform: translateY(-140%) } 20%, 80% { transform: none; opacity: 1 } to { transform: none; opacity: 0 } }
@keyframes turn-fade { from { opacity: 0 } 15%, 80% { opacity: 1 } to { opacity: 0 } }

/* the menu: tabs, settings, a line between keeping and losing the game */
#sheet.wide { width: min(560px, calc((100vw - 24px) / var(--ui-scale))) }
.pick.tabs { flex-wrap: nowrap; margin-bottom: 16px } .tabs button { flex: 1; padding: 6px } .quiet:disabled { opacity: .45; cursor: default }
.set .line { margin-bottom: 10px } .set .pick { margin: 0 } .set input { flex: 1; max-width: 260px; height: 44px; accent-color: var(--gold) } .set .about { margin: -4px 0 10px }
dialog hr { border: 0; border-top: 1px solid var(--line2); margin: 6px 0 } #sheet-body a { color: var(--gold2) }
.quiet.danger { border-color: var(--danger); color: #f3c9bb } .danger[data-armed] { background: rgba(224, 138, 114, .2) }

/* the end: the winner large, places, land over time; win and loss share the layout and differ in tone */
#sheet.end { width: min(860px, calc((100vw - 16px) / var(--ui-scale))); max-height: calc(96vh / var(--ui-scale)) }
.end.win { --tone: var(--win) } .end.lose { --tone: var(--lose) }
.end h2 { font: 600 14px/1.2 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--tone) }
.hero { display: flex; align-items: center; gap: 18px; margin-bottom: 16px; padding: 14px 16px; border-left: 6px solid var(--tone); border-radius: 10px; background: rgba(255, 244, 214, .05) }
.hero .arms { display: flex; flex: none } .hero canvas { width: 84px; height: 84px } .hero canvas + canvas { margin-left: -22px }
.hero b { display: block; font: 600 clamp(30px, 5vw, 46px)/1.05 var(--serif); margin-bottom: 6px } .hero p { margin: 0 0 3px; color: #d8cfba }
.ranks { overflow-x: auto; margin-bottom: 14px } .ranks table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap }
.ranks th, .ranks td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--line) } .ranks tr:first-child th { font: 500 13px var(--sans); color: var(--soft) }
.ranks th[scope=row] { font: 600 16px var(--serif) } .ranks canvas { width: 24px; height: 24px; vertical-align: -6px; margin-right: 8px } .ranks .won { color: var(--tone) } .ranks small { color: var(--soft); font: 400 13px var(--sans) }
.end #chart { height: auto; aspect-ratio: 880 / 280 }
.end .ends { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; padding: 10px 0; background: #161c1e } .end .minor { position: static; justify-content: center; gap: 28px }
a.quiet { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; color: inherit }

/* seat patterns on the score bar, for telling seats apart without colour */
.patterns #land { height: 14px }
.patterns #fills i { position: relative } .patterns #fills i::after { content: ""; position: absolute; inset: 0 } /* over the seat colour, which is set on the element itself */
/* the same six as on the board (src/map/paint.js): /, dots, |, x, \, - */

const DOCK = [["actions", "Actions"], ["chats", "Chats"], ["ledger", "Ledger"], ["advisors", "Advisors"], ["master", "Game Master"]];
function dock() {
  const unread = state && state.log.length && state.turn > (state.seen || 0);
  $("dock").replaceChildren(...DOCK.map(([k, t]) => {
    const label = k === "chats" && state?.mode === "citizen" ? "Contacts" : k === "advisors" && state?.mode === "citizen" ? "Circle" : t;
    const b = button("", () => open(sheet === k ? null : k), ""); b.append(icon(k), el("span", label)); b.setAttribute("aria-pressed", String(sheet === k));
    if (k === "ledger" && unread) { b.append(el("span", undefined, "dot")); b.setAttribute("aria-label", "Ledger, new"); }
    return b;
  }));
}

function open(which) {

  const box = $("sheet");

  if (!which) { box.classList.remove("open"); return; }

  box.replaceChildren();
  ({ actions, chats, ledger, advisors, master, game: gameSheet }[which])(box);
  const head = el("div", undefined, "head"), title = box.querySelector("h2"), shut = button("", () => open(null), "ic");

function actions(box) {

  input.rows = 3; input.maxLength = 600; input.placeholder = "What do you do? For example: Offer our neighbours a trade pact, and quietly move troops to the border.";

  }));

    li.append(el("span", `${name(o.from)} offers ${what} (${fmtDate(o.date)}).`), ...(taken ? [el("b", "Accepted")] : [button("Accept", () => order({ text: `Accept ${name(o.from)}'s offer of ${what}.`, verb, target: o.from, detail: peace ? "" : o.kind }))]),
      button("Decline", () => { state.offers = state.offers.filter((x) => x !== o); const old = (state.orders || []).find((x) => x.verb === verb && x.target === o.from); state.orders = (state.orders || []).filter((x) => x !== old); state.actions = (state.actions || []).filter((x) => x !== old?.text); save(); open("actions"); }));

/** How the paste route goes, in three steps. */
function steps() {
  const ol = el("ol", undefined, "steps");
  for (const s of route.route === "paste" ? ["Copy the prompt.", "Paste it into a new chat with any AI you use.", "Paste the whole reply back here, and read it."] : ["The AI at your address did not answer.", "Ask again, or copy the prompt into any AI chat.", "Paste the reply back here."]) ol.append(el("li", s));
  return ol;
}

function waiting() {

  return w;
}

function pasteBox() {

  const wrap = el("div"), out = el("textarea", undefined, "plain paste"), back = el("textarea", undefined, "plain paste");
  out.value = pending.prompt; out.readOnly = true; out.setAttribute("aria-label", "The prompt");
  back.placeholder = "Paste the AI's whole reply here."; back.setAttribute("aria-label", "The AI's reply");
  const go = el("div", undefined, "row");
  go.append(button("Copy the prompt", async () => { try { await navigator.clipboard.writeText(pending.prompt); toast("Copied. Paste it into a new chat."); } catch { out.select(); } }), button("Read the reply", () => finish(back.value), "go"), button("Cancel", () => { pending = null; open("actions"); }));
  if (route.route === "address") go.prepend(button("Ask again", () => viaAddress()));
  wrap.append(el("h3", route.route === "paste" ? "Paste this into a new chat" : "The AI did not answer"), ...(pending.error ? [el("p", pending.error, "warn")] : []), steps(), out, back, go);
  return wrap;
}

function advance() {
  if (calling) return toast("Capo is already waiting for the AI.");
  const acts = state.actions || [], bad = crossesLine(acts);
  if (bad.length) return toast(`Action ${bad.join(", ")} is refused: nothing sexual involving minors.`);
  const to = jumpFrom(state.date, jump);
