<style>
/* SPDX-License-Identifier: AGPL-3.0-or-later */
/* Every game screen takes its look from this file: the four table games, Capo and the world map.
   1. Tokens: colour, type, space, shape, depth, motion. 2. Materials. 3. Components. 4. The table games' layout.
   The rule of three materials: LACQUER (dark, a silver keyline) is what floats over the map and stays; PAPER is what you
   pick up and read (a dispatch, a card, the rules, a lesson); SILVER is the one main action in view and the mark of what is chosen.
   Blue and silver (the owner, 26 November): no gold. Warm colour belongs to the seats and the boards alone. */

/* ---- 1. tokens ---- */
@font-face { font-family: "Tent Roman"; src: url("../site/fonts/tent-roman/tent-roman.woff2") format("woff2"); font-display: swap }
@font-face { font-family: "Spectral"; src: url("../site/fonts/spectral/spectral-400.woff2") format("woff2"); font-display: swap }
@font-face { font-family: "Atkinson Hyperlegible"; src: url("../site/fonts/atkinson/atkinson-400.woff2") format("woff2"); font-display: swap }
@font-face { font-family: "Atkinson Hyperlegible"; font-weight: 700; src: url("../site/fonts/atkinson/atkinson-700.woff2") format("woff2"); font-display: swap }
:root {
  /* colour, by role: the front page's night chart (docs/design/modern-site/direction.md). Daylight first; lamplight below. Both are the tent's
     dark blue (ruling 126), a brighter and a deeper one, so seat colours read the same. Three grounds: the room, the deep HUD, the raised sheet */
  --ground: #22364f; --ground-2: #2b4263; --lacquer: rgba(22, 37, 58, .9); --plate: #16253a; --slate: #2b4263; --shade: 15, 26, 42;
  --text: #eef1f5; --text-2: #c9d1da; --text-3: #adb8c4;
  --edge: rgba(214, 224, 236, .5); --edge-soft: rgba(214, 224, 236, .16); --raise: rgba(214, 224, 236, .07); --sheen: rgba(214, 224, 236, .07);
  --accent: #dfe5ec; --accent-hi: #f6f8fb; --accent-lo: #6f7f93; --accent-wash: rgba(214, 224, 236, .15); --on-accent: #0f1a2a;
  --paper: #e9edf2; --paper-edge: #9aa7b6; --paper-ink: #142033; --paper-soft: #44526a; --paper-accent: #2b4263;
  --danger: #f0a08c; --danger-wash: rgba(240, 160, 140, .16); --good: #9fd08a; --win: var(--accent-hi); --lose: #8ea3bd;
  --focus: #f6f8fb; --halo: #0a121e; --seat: var(--accent); --pattern: rgba(16, 12, 10, .42);
  /* type: a display roman for names and headings (18 px and up, never bold), a reading serif, a plain face for labels and numbers */
  --display: "Tent Roman", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --serif: "Spectral", "Iowan Old Style", Georgia, "Times New Roman", serif;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --fs-1: 13px; --fs-2: 14px; --fs-3: 16px; --fs-4: 18px; --fs-5: 22px; --fs-6: 28px; --fs-7: 40px; --caps: .14em;
  /* space, shape, depth, motion */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px; --tap: 44px; --tap-lg: 50px;
  --r-1: 4px; --r-2: 6px; --r-3: 10px;
  --lift-1: 0 1px 4px rgba(0, 0, 0, .3); --lift-2: 0 6px 20px rgba(0, 0, 0, .34); --lift-3: 0 18px 50px rgba(0, 0, 0, .5); /* only for what floats over a map; elsewhere a lighter ground and a hairline do the lifting */
  --t-1: .12s; --t-2: .2s; --t-3: .32s; --t-4: .6s; --ease: cubic-bezier(.2, .8, .2, 1);
  --ui-scale: 1; --banner-time: .9s;
  /* the names older rules used, kept so nothing written against them breaks */
  --table: var(--ground); --table2: var(--ground-2); --panel: var(--lacquer); --line: var(--edge-soft); --line2: var(--edge); --soft: var(--text-3); --gold: var(--accent); --gold2: var(--accent-hi); --on: var(--on-accent);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ground: #0f1a2a; --ground-2: #162539; --lacquer: rgba(10, 18, 30, .9); --plate: #0b141f; --slate: #162539; --shade: 6, 11, 19; --text: #e6eaef; --text-2: #b9c2cc; --text-3: #9ba7b4; --edge: rgba(205, 216, 229, .45); --edge-soft: rgba(205, 216, 229, .13); --accent: #d3dbe4; --accent-hi: #eef2f6; --paper: #cdd5de; --paper-edge: #8794a4 } }
:root[data-theme="dark"] { --ground: #0f1a2a; --ground-2: #162539; --lacquer: rgba(10, 18, 30, .9); --plate: #0b141f; --slate: #162539; --shade: 6, 11, 19; --text: #e6eaef; --text-2: #b9c2cc; --text-3: #9ba7b4; --edge: rgba(205, 216, 229, .45); --edge-soft: rgba(205, 216, 229, .13); --accent: #d3dbe4; --accent-hi: #eef2f6; --paper: #cdd5de; --paper-edge: #8794a4 }

* { box-sizing: border-box; margin: 0 }
[hidden] { display: none !important }
html, body { height: 100%; overflow: hidden }
body { background: radial-gradient(120% 90% at 50% 42%, var(--ground-2), var(--ground) 72%); color: var(--text); font: var(--fs-3)/1.45 var(--sans); -webkit-tap-highlight-color: transparent }
button, select, input, textarea { font: inherit; color: inherit }
button { cursor: pointer; touch-action: manipulation }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; box-shadow: 0 0 0 5px var(--halo) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap }
.menu .play-h { display: none } /* the page heading in play; the title screen has its own */

/* ---- 2. materials ---- */
.panel, .glass, .seat, #toast { background: var(--lacquer); border: 1px solid var(--edge-soft); border-top-color: var(--edge); border-radius: var(--r-2); box-shadow: var(--lift-2), inset 0 1px 0 var(--sheen); backdrop-filter: blur(12px) saturate(1.1); -webkit-backdrop-filter: blur(12px) saturate(1.1) }
dialog.panel { background: var(--slate); border-color: var(--edge); box-shadow: var(--lift-3), inset 0 1px 0 var(--sheen) }
/* paper rebinds the roles, so every component laid on it turns to ink without a rule of its own */
.paper, #news, #coach, #hand > * {
  --text: var(--paper-ink); --text-2: var(--paper-ink); --text-3: var(--paper-soft); --edge: rgba(20, 32, 51, .6); --edge-soft: rgba(20, 32, 51, .24); --raise: rgba(20, 32, 51, .06); --sheen: transparent;
  --accent: var(--paper-accent); --accent-hi: var(--paper-accent); --accent-wash: rgba(43, 66, 99, .14); --focus: var(--paper-ink); --halo: var(--paper); --danger: #8f2b22;
  background: var(--paper); color: var(--text); border: 1px solid var(--paper-edge); backdrop-filter: none; -webkit-backdrop-filter: none; color-scheme: light;
}

/* ---- 3. components ---- */
/* buttons: one silver plate a view (.main, Capo's .go), lacquer for the rest (.quiet, .plain), words alone (.text), a mark alone (.icon, .ic) */
.main, .quiet, button.plain, button.go, .pick button { min-height: var(--tap); border-radius: var(--r-1); border: 1px solid var(--edge); transition: background var(--t-1), border-color var(--t-1), filter var(--t-1) }
.main, .quiet { min-height: var(--tap-lg); padding: 0 var(--sp-4); font-weight: 700; letter-spacing: .01em }
.main, button.go { background: linear-gradient(#f8fafc, #d6dee7 55%, #b4c1cf); border-color: #6f7f93; color: #0f1a2a; font-weight: 700; box-shadow: 0 2px 0 rgba(0, 0, 0, .4), inset 0 1px 0 #fff }
.main { flex: 1 }
.main:hover, button.go:hover { filter: brightness(1.07) } .main:active, button.go:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3) }
.main:disabled, button.go:disabled { background: none; border: 1px dashed var(--edge); color: var(--text-3); box-shadow: none; filter: none; transform: none; cursor: default; font-weight: 400 }
.main small { font-weight: 400; opacity: .8 }
.quiet, button.plain, .pick button { background: var(--raise); color: var(--text) } .quiet:hover, button.plain:hover, .pick button:hover:not(:disabled) { background: var(--accent-wash) }
.quiet:disabled { opacity: .45; cursor: default }
.quiet.danger { border-color: var(--danger); color: var(--danger) } .danger[data-armed] { background: var(--danger-wash) }
a.quiet { display: flex; align-items: center; justify-content: center; text-align: center; text-decoration: none; color: inherit }
button.plain { padding: 0 var(--sp-3); font-size: var(--fs-2) } button.go { display: inline-flex; align-items: center; gap: 6px; padding: 0 var(--sp-4) }
.text { background: none; border: 0; padding: 12px 4px; min-height: var(--tap); color: var(--text-2); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--edge) } .text:hover { color: var(--accent-hi) }
.icon, button.ic { flex: none; display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); padding: 0; border: 0; border-radius: var(--r-1); background: none; color: var(--text) }
button.ic { border: 1px solid var(--edge-soft); background: var(--raise) }
.icon:hover, button.ic:hover { background: var(--accent-wash) }
.icon svg, svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; display: block }
/* chosen: a bright edge, a bar under it and heavier words, so it never rests on colour alone; the system's own mark when colours are forced */
[aria-pressed=true]:is(button.plain, .pick button, .wear-row button), .pick [aria-checked=true] { border-color: var(--accent); background: var(--accent-wash); box-shadow: inset 0 0 0 1px var(--accent), inset 0 -4px 0 var(--accent); font-weight: 700 }
@media (forced-colors: active) { [aria-checked=true], [aria-pressed=true], [aria-selected=true] { outline: 3px solid Highlight; outline-offset: -3px } #fills i, #goal, .dot { forced-color-adjust: none } } /* seat colours stay seat colours */
/* a row of buttons wraps before it runs off the panel; the main one takes what is left, or a row of its own */
.go { display: flex; flex-wrap: wrap; gap: var(--sp-2) } .go > .quiet { flex: 0 1 auto; white-space: nowrap } .go > .main { flex: 1 1 9em; padding: 4px var(--sp-3); line-height: 1.15; text-wrap: balance }
/* choices in a row: one control, arrows move in it */
.pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px }
.pick.even > * { flex: 1 }
.pick button { min-height: 46px; padding: 6px 13px; line-height: 1.15; text-align: center }
.pick button:disabled { cursor: default; color: var(--text-3); border-style: dashed }
.pick small { display: block; color: var(--text-3); font-size: var(--fs-1) } .pick [aria-checked=true] small { color: var(--text-2) }
.pick.small { margin: 0 } .pick.small button { min-height: var(--tap); min-width: var(--tap) }
/* a long list of places wraps into rows and scrolls down inside a box of about three and a half rows, so the half row says there is more (shell p10) */
.strip { max-height: calc(3.5 * (46px + 6px)); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--edge) transparent; padding: 2px; margin-inline: -2px; scroll-padding-block: 4px }
.strip > * { flex: 1 0 auto; max-width: 100% }
#act, dialog, #record ol, #news ul { scrollbar-width: thin; scrollbar-color: var(--edge) transparent }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 7px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .5); transform: rotate(45deg) }
/* tabs: words on a rule, the chosen one underlined in silver */
.pick.tabs { flex-wrap: nowrap; gap: 0; margin-bottom: var(--sp-4); border-bottom: 1px solid var(--edge-soft) }
.tabs button { flex: 1; padding: 6px 4px; border: 0; border-bottom: 3px solid transparent; border-radius: 0; background: none; color: var(--text-3); font-weight: 700 }
.tabs [aria-selected=true] { background: none; box-shadow: none; border-color: var(--accent); color: var(--text) }
/* zoom, for the board (the table games) and the map (Capo): plus, minus, all of it */
.zoom { position: fixed; z-index: 2; left: max(16px, env(safe-area-inset-left)); bottom: max(16px, env(safe-area-inset-bottom)); display: grid; gap: 6px } .zoom button { width: var(--tap); min-width: var(--tap); min-height: var(--tap); padding: 0; font-size: 20px; background: var(--lacquer) }
/* fields */
.field, .paste, select, .plain:is(select, input, textarea) { min-height: var(--tap); padding: 8px 12px; border-radius: var(--r-1); border: 1px solid var(--edge); background: rgba(var(--shade), .55); color: var(--text) }
.paper :is(.field, .paste, select) { background: rgba(255, 255, 255, .35) }
.paste { width: 100%; resize: vertical; font-size: var(--fs-2); word-break: break-all } textarea.plain { width: 100%; resize: vertical; line-height: 1.45 }
input[type=range] { accent-color: var(--accent) }
/* headings and small labels */
h1, h2, .seat b { font-family: var(--display); font-weight: 400 } /* names and headings; its figures are old-style, so anything with a number in it is set in the plain face */
.eyebrow, .seat dt, .ranks tr:first-child th, #turn small, .end h2, .cap { font: 700 var(--fs-1)/1.3 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) }
/* sheets: one at a time, lacquer for the menu and the end, paper for what is read */
dialog { color: var(--text); margin: auto; width: min(480px, calc((100vw - 32px) / var(--ui-scale))); max-height: min(calc(84vh / var(--ui-scale)), 640px); padding: 22px; overflow-y: auto; scroll-padding-bottom: 84px } /* a row reached by Tab is never left under the sticky buttons */ dialog::backdrop { background: rgba(var(--shade), .66) }
dialog h2 { font-size: var(--fs-6); line-height: 1.15; margin-bottom: var(--sp-3) } dialog p, dialog li { margin-bottom: 9px } dialog ul { padding-left: 20px; margin-bottom: 12px } dialog .stack { display: grid; gap: var(--sp-2); margin-bottom: 14px }
dialog.paper :is(p, li) { font-family: var(--serif); font-size: 17px; line-height: 1.5 }
dialog .stack button { min-height: 48px } dialog .go { position: sticky; bottom: -22px; padding-bottom: 4px }
dialog .stack > button canvas { width: 22px; height: 22px; vertical-align: -5px; margin-right: 10px } dialog .stack .go { position: static; padding: 0 }
dialog > .go { background: inherit; margin: 0 -22px -22px; padding: 10px 22px 18px !important; border-top: 1px solid var(--edge-soft) }
dialog.paper > .go { background: var(--paper) }
dialog hr { border: 0; border-top: 1px solid var(--edge); margin: 6px 0 } #sheet-body a { color: var(--accent-hi) }
#sheet.wide { width: min(560px, calc((100vw - 24px) / var(--ui-scale))) }
#sheet.tabbed { height: min(calc(84vh / var(--ui-scale)), 640px) } /* the menu keeps one size from tab to tab, so its tab row never moves under the pointer */
#log { max-height: 34vh; overflow-y: auto; padding-left: 26px; color: var(--text-2) }
/* words over the board: one line at a time, never in the way */
#toast { position: fixed; z-index: 2; left: 50%; top: 84px; transform: translate(-50%, -8px); max-width: min(520px, calc(100vw - 32px)); padding: 9px 18px; border-left: 3px solid var(--accent); text-align: center; font: var(--fs-3)/1.35 var(--sans); opacity: 0; transition: opacity var(--t-3), transform var(--t-3); pointer-events: none }
#toast.on { opacity: 1; transform: translate(-50%, 0) }
/* the chosen place named on the board, above it (shell p10); under the panels, never in the way of a tap */
.cell-tag { position: fixed; z-index: 1; transform: translate(-50%, calc(-100% - 22px)); padding: 2px 8px; border-radius: var(--r-1); background: var(--lacquer); border: 1px solid var(--edge); box-shadow: var(--lift-1); font: 700 var(--fs-1)/1.4 var(--sans); white-space: nowrap; pointer-events: none; zoom: var(--ui-scale) }

/* ---- 4. the table games ---- */
#stage { position: fixed; inset: 0 }
.board-layer { position: absolute; inset: 0 }
#stage svg { position: absolute; inset: 0; width: 100%; height: 100% }
.shade { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity var(--t-4); background: linear-gradient(90deg, rgba(var(--shade), .95) 0, rgba(var(--shade), .78) 36%, rgba(var(--shade), .1) 72%) }
.menu .shade { opacity: 1 }

/* top bar: a plate hung from the top edge. Round, the land held, the goal */
#bar { position: fixed; z-index: 3; top: 0; left: 50%; transform: translateX(-50%); width: min(620px, calc((100vw - 24px) / var(--ui-scale))); display: flex; align-items: center; gap: var(--sp-2); padding: max(6px, env(safe-area-inset-top)) 6px 6px; border-top: 0; border-radius: 0 0 var(--r-3) var(--r-3); border-bottom-color: var(--edge) }
#bar .mid { flex: 1; min-width: 0; padding: 2px 4px 5px }
#round { font: 700 var(--fs-3)/1.25 var(--sans); letter-spacing: .04em; text-align: center; text-wrap: balance; overflow-wrap: break-word } /* at larger text it takes two lines, never cut; the seats below follow the bar down (--bar-b) */
#land { position: relative; height: 10px; margin-top: 5px; border-radius: 2px; background: var(--raise); box-shadow: 0 0 0 1px var(--edge-soft) }
#fills { display: flex; height: 100%; border-radius: 2px; overflow: hidden }
#fills i { display: block; height: 100%; transition: width .7s cubic-bezier(.3, .7, .3, 1) }
#fills i + i { box-shadow: inset 1px 0 0 rgba(0, 0, 0, .6) }
#goal { position: absolute; top: -4px; bottom: -4px; width: 3px; margin-left: -1px; background: var(--accent-hi); box-shadow: 0 0 0 1px var(--halo) }

/* seats: a colour bar, the sign, the name, two or three figures. The one to move is keyed in silver */
#seats { position: fixed; z-index: 2; list-style: none; padding: 0; left: max(16px, env(safe-area-inset-left)); top: 50%; transform: translateY(-50%); width: 208px; display: grid; gap: 10px }
.seat { position: relative; padding: 10px 12px 10px 54px; border-left: 4px solid var(--seat); box-shadow: var(--lift-1); transition: border-color var(--t-2), transform var(--t-2) var(--ease) }
.seat.now { border-color: var(--accent); border-left-color: var(--seat); box-shadow: 0 0 0 1px var(--accent), var(--lift-2); transform: translateX(6px) }
.seat.out { opacity: .5 }
.seat canvas { position: absolute; left: 11px; top: 12px; width: 32px; height: 32px }
.seat b { font-size: 19px; line-height: 1.15; display: block }
.seat small { color: var(--text-3); font-size: var(--fs-1) }
.seat dl { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0 -42px; font-variant-numeric: tabular-nums } /* four figures wrap inside the card rather than over the board */
.seat dt { color: var(--text-3); letter-spacing: .05em; font-size: 12px; white-space: nowrap } .seat dd { font-weight: 700; font-size: var(--fs-3) }

/* the move: what you can do now. The tray at the bottom of a phone */
#act { --px: 16px; --pb: 16px; position: fixed; z-index: 3; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom)); width: 340px; max-height: calc((100vh - 96px) / var(--ui-scale)); overflow-y: auto; scrollbar-width: thin; padding: 14px var(--px) var(--pb) }
/* the row that ends a move (End turn, the main button, Take back) stays at the panel's foot however far its lists scroll */
#act #choice > .go, #act > #after { position: sticky; z-index: 1; bottom: calc(-1 * var(--pb)); margin: 0 calc(-1 * var(--px)) calc(-1 * var(--pb)); padding: 10px var(--px) var(--pb); background: var(--plate); box-shadow: 0 -10px 12px -10px rgba(0, 0, 0, .5); border-radius: 0 0 var(--r-2) var(--r-2) }
#act #choice > .go:not(:last-child) { margin-bottom: 0 } /* a line after the row (Concede) scrolls up from under it */
#act #live-go { position: sticky; z-index: 1; bottom: calc(8px - var(--pb)); box-shadow: 0 0 0 8px var(--plate), 0 2px 0 rgba(0, 0, 0, .4), inset 0 1px 0 #fff } /* real time: Send stays in view */
/* the finished game again, move by move */
.story { margin-bottom: var(--sp-2) } .story .cap { display: block; margin-bottom: 2px }
.story-row { display: flex; align-items: center; gap: 6px } .story-row input { flex: 1; min-width: 0; height: var(--tap) } #act .story-row .quiet { flex: none; width: var(--tap); min-height: var(--tap); padding: 0; font-size: 22px; line-height: 1 }
.story output { display: block; min-height: 1.4em; font-size: var(--fs-2); color: var(--text-2); font-variant-numeric: tabular-nums }
#status { font: 700 var(--fs-4)/1.25 var(--sans); margin-bottom: 10px; min-height: 1.25em; text-wrap: balance }
#act .quiet { padding: 0 14px } #send + .quiet, #act > .quiet { width: 100%; margin-top: var(--sp-2) }
#choice > .text { display: block; margin: 2px auto -10px; font-size: var(--fs-2) }
#info { color: var(--text-2); font-size: var(--fs-2); min-height: 2.9em; margin-bottom: var(--sp-2) }
#amount { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: var(--tap) } #much { flex: 1; min-width: 60px; height: var(--tap) } #amount button.ic { font: 700 var(--fs-4)/1 var(--sans) } #amount button:disabled { opacity: .4; cursor: default }
#many { width: 4.4em; min-height: var(--tap); padding: 0 8px; border-radius: var(--r-1); border: 1px solid var(--edge); background: rgba(var(--shade), .55); text-align: right; font: 700 var(--fs-4)/1 var(--sans); font-variant-numeric: tabular-nums; appearance: textfield; -moz-appearance: textfield } #many::-webkit-inner-spin-button, #many::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0 }
#bag { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-bottom: 10px; font-size: var(--fs-1); color: var(--text-2) } #bag span { display: inline-flex; align-items: center; gap: 3px; font-variant-numeric: tabular-nums; color: var(--text) } #bag svg { width: 18px; height: 18px; display: block }
#dice { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 10px } #dice div { display: flex; gap: 4px } #dice svg { width: 30px; height: 30px; display: block; animation: tumble .28s ease-out backwards }
@keyframes tumble { from { transform: rotate(-140deg) scale(.5); opacity: 0 } }
#send p { color: var(--text-2); margin-bottom: 10px }
/* cards in the hand are paper, and big enough to tap */
#hand { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: var(--sp-2) } #hand:empty, #trades:empty { display: none } #hand button, #hand span { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 2px 10px; border-radius: var(--r-1); font-size: var(--fs-2); box-shadow: var(--lift-1) } #hand button { min-height: var(--tap) } #hand svg { width: 16px; height: 16px } #trades { margin-bottom: var(--sp-2) }
.goods { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: var(--sp-2) } .goods span { padding: 3px 9px; border-radius: var(--r-1); background: var(--raise); color: #20221c; font-size: var(--fs-2); font-weight: 700 } .goods span:nth-last-child(-n+2):not([style]) { color: var(--text) }
#live .live-info { color: var(--text-2); font-size: var(--fs-2); margin-bottom: var(--sp-2) } .live-row { display: flex; align-items: center; gap: 10px; margin-bottom: var(--sp-2) } .live-row input { flex: 1; height: var(--tap) } .live-row output { min-width: 3em; text-align: right; font: 700 var(--fs-4)/1 var(--sans) }
#leaders { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 3px; font-size: var(--fs-2) } #leaders li { display: flex; align-items: center; gap: 4px } #leaders b { flex: 1; font-weight: 700 } #leaders li.me b { color: var(--accent-hi) } #live .go button[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent) }
/* since your last turn: a dispatch. One line until it is opened, so it never takes the board */
#news { position: relative; margin-bottom: 10px; padding: 0 44px 0 12px; border-radius: var(--r-1); font-size: var(--fs-2); box-shadow: var(--lift-1) }
#news.none { position: absolute; width: 1px; height: 1px; margin: 0; padding: 0; border: 0; overflow: hidden; clip-path: inset(50%) } #news.none > button { display: none } /* empty, but its spoken part stays in place so the next summary is said */
#news .head { display: block; width: 100%; min-height: var(--tap); padding: 0; border: 0; background: none; text-align: left; font: 700 var(--fs-1)/1.3 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) } #news .head::after { content: " \25BE"; content: " \25BE" / "" } #news .head[aria-expanded=true]::after { content: " \25B4"; content: " \25B4" / "" } /* the arrows are seen, not read: the button says open or shut */
#news ul { padding: 0 0 10px 18px; max-height: 26vh; overflow-y: auto; font-family: var(--serif); font-size: 15px } #news small { display: block; margin: -4px 0 10px; color: var(--text-3) }
#news:not(.open) :is(li + li, small) { display: none } #news:not(.open) ul { list-style: none; padding-left: 0 } #news:not(.open) li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
#news .shut { position: absolute; top: 0; right: 0; width: var(--tap); height: var(--tap); border: 0; background: none; font-size: 22px; color: var(--text-3) }
/* the record of the game, docked beside the board on wide screens */
#record { position: fixed; z-index: 2; right: max(16px, env(safe-area-inset-right)); top: 78px; width: 340px; max-height: calc(100vh - var(--ah, 300px) - 108px); display: flex; flex-direction: column; padding: 2px 4px 8px } .atlas #record { top: 180px }
#record .head { min-height: var(--tap); padding: 0 12px; border: 0; background: none; text-align: left; font: 700 var(--fs-1) var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent) } #record .head::after { content: " \25B4"; content: " \25B4" / "" } #record [aria-expanded=false]::after { content: " \25BE"; content: " \25BE" / "" }
#record ol { overflow-y: auto; padding: 0 12px 0 34px; font-size: var(--fs-2); color: var(--text-2); scrollbar-width: thin; scrollbar-color: var(--edge) transparent } #record li + li { margin-top: 3px } #record li::marker { color: var(--text-3) }
@media (min-width: 1181px) { #logs { display: none } }

/* the title: the game's name over its own board, one plate to press */
.title { position: fixed; z-index: 4; inset: 0; overflow-y: auto; padding: max(6vh, 28px) 24px 64px max(6vw, 24px); display: flex; flex-direction: column; justify-content: safe center; gap: 14px; max-width: 540px }
.eyebrow::before { content: ""; display: inline-block; width: 28px; height: 1px; margin-right: 10px; vertical-align: .3em; background: currentColor }
h1 { font-size: clamp(2.6rem, 1.1rem + 5vw, 5.5rem); line-height: 1; letter-spacing: -.015em; text-wrap: balance; text-shadow: 0 4px 30px rgba(0, 0, 0, .6) }
.tag { font: 19px/1.45 var(--serif); color: var(--text-2); max-width: 24em }
.card { padding: var(--sp-4); width: min(430px, 100%) }
.line { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap } .line > span { color: var(--text-3) } .line .field { width: 190px }
#who { list-style: none; padding: 0; margin-bottom: 12px; display: grid; gap: 6px }
#who li { display: flex; align-items: center; gap: 10px } #who canvas { width: 28px; height: 28px; flex: none } #who b { font: 400 19px/1 var(--display) }
.wear { flex: 1; display: flex; align-items: center; gap: 10px; min-height: var(--tap); border: 0; background: none; padding: 0 4px; border-radius: var(--r-1); text-align: left } .wear:hover { background: var(--accent-wash) }
.wear-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; margin-bottom: 14px } .wear-row button { position: relative; min-height: 52px; border-radius: var(--r-1); border: 1px solid var(--edge-soft); background: var(--raise) } .wear-row canvas { width: 34px; height: 34px; display: block; margin: auto } .wear-row small { position: absolute; right: 5px; bottom: 2px; color: var(--text-3); font-size: 12px }
.links { display: flex; gap: 2px 20px; flex-wrap: wrap }
.about { margin: -6px 0 12px; font-size: var(--fs-1); color: var(--text-3) } .about span { display: block } .about span + span { margin-top: 5px } .about span:first-child { color: var(--text) }
.more:empty { display: none } .more .head { display: block; color: var(--text-3); margin-bottom: 6px } .more .pick { margin-bottom: var(--sp-2) } .more .line { margin-bottom: var(--sp-2) } .more .about { margin: 0 0 10px; min-height: 0 } .more .about:empty { display: none }
#style small { font-size: 12px }
.exps { display: grid; gap: var(--sp-2); margin-bottom: var(--sp-2) } .exp { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center } .exp button { min-width: 88px } .more .exp .about { margin: 0; line-height: 1.35 } /* an expansion and what it adds, side by side */
#quick { min-height: 58px; font-size: 20px; letter-spacing: .04em } #preset { margin: 10px 0 4px } #own > summary { min-height: var(--tap); display: flex; align-items: center; color: var(--text-2); cursor: pointer } #own > summary::before { content: "+"; width: 1.2em; color: var(--accent) } #own[open] > summary::before { content: "\2212" } #own[open] > summary { margin-bottom: var(--sp-2) } #own .go > * { flex: 1 }
.title .card > .text { display: block; margin: 2px 0 -6px; color: var(--accent-hi) }
#foot { position: fixed; z-index: 5; right: 16px; bottom: 10px; display: none; gap: 14px; font-size: var(--fs-1); color: var(--text-3) } .menu #foot { display: flex } #foot a { color: inherit; display: inline-block; padding: 13px 6px; margin: -13px -6px } /* a 44 px target in the same line */
.broken { position: fixed; inset: auto 16px 16px; z-index: 9; padding: 12px 16px; background: #5a2318; border-radius: var(--r-2); opacity: 0; animation: late 0s 2.5s forwards } @keyframes late { to { opacity: 1 } }
.set .line { margin-bottom: 10px } .set .pick { margin: 0 } .set input { flex: 1; max-width: 260px; height: var(--tap) } .set .about { margin: -4px 0 10px }

/* text size: the floating parts grow together, and widths are divided back so nothing leaves the screen */
#bar, #seats, #act, #record, #toast, #sheet, #turn, .title .card, .title .links { zoom: var(--ui-scale) }

/* the turn banner: in, held, gone in under a second; a fade when motion is reduced */
#turn { position: fixed; z-index: 6; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; margin: auto; width: max-content; max-width: calc((100vw - 24px) / var(--ui-scale)); display: grid; grid-template-columns: auto auto; column-gap: var(--sp-4); align-items: center; padding: 10px 30px 10px 14px; border-radius: var(--r-2); background: var(--slate); border: 1px solid var(--accent); border-left: 12px solid var(--seat); box-shadow: var(--lift-3); pointer-events: none }
#turn canvas { grid-row: 1 / span 3; width: 60px; height: 60px }
#turn small { color: var(--text-3) }
#turn b { font: 400 32px/1.05 var(--display) } #turn span { font: var(--fs-3)/1.3 var(--sans); color: var(--accent-hi) }
#turn.go { animation: turn-in var(--banner-time) var(--ease) both } .still #turn.go { animation-name: turn-fade }
@keyframes turn-in { from { transform: translateY(-140%) } 20%, 80% { transform: none; opacity: 1 } to { transform: none; opacity: 0 } }
@keyframes turn-fade { from { opacity: 0 } 15%, 80% { opacity: 1 } to { opacity: 0 } }

/* the end: the winner large, places, land over time; win and loss share the layout and differ in tone */
#sheet.end { width: min(860px, calc((100vw - 16px) / var(--ui-scale))); max-height: calc(96vh / var(--ui-scale)) }
.end.win { --tone: var(--win) } .end.lose { --tone: var(--lose) }
.end h2 { color: var(--tone); font-size: var(--fs-2); letter-spacing: .16em }
.hero { display: flex; align-items: center; gap: 18px; margin-bottom: var(--sp-4); padding: 14px 16px; border-left: 6px solid var(--tone); border-radius: var(--r-1); background: var(--raise) }
.hero .arms { display: flex; flex: none } .hero canvas { width: 84px; height: 84px } .hero canvas + canvas { margin-left: -22px }
.hero b { display: block; font: 400 clamp(32px, 5vw, 48px)/1.05 var(--display); margin-bottom: 6px } .hero p { margin: 0 0 3px; color: var(--text-2) }
.ranks { overflow-x: auto; margin-bottom: 14px } .ranks table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; white-space: nowrap }
.ranks th, .ranks td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--edge-soft) } .ranks tr:first-child th { color: var(--text-3) }
.ranks th[scope=row] { font: 400 19px var(--display) } .ranks canvas { width: 24px; height: 24px; vertical-align: -6px; margin-right: 8px } .ranks .won { color: var(--tone) } .ranks small { color: var(--text-3); font: var(--fs-1) var(--sans) }
#chart { display: block; width: 100%; height: 120px; margin-bottom: 14px; border-radius: var(--r-1); background: var(--raise) } .end #chart { height: auto; aspect-ratio: 880 / 280 }
.end .ends { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: var(--sp-2); padding: 10px 0; background: inherit } .end .minor { position: static; justify-content: center; gap: 28px }

/* seat patterns on the score bar, for telling seats apart without colour */
.patterns #land { height: 14px }
.patterns #fills i { position: relative } .patterns #fills i::after { content: ""; position: absolute; inset: 0 } /* over the seat colour, which is set on the element itself */
/* the same six as on the board (src/map/paint.js): /, dots, |, x, \, - */
.patterns #fills i:nth-child(6n+1)::after { background-image: repeating-linear-gradient(135deg, var(--pattern) 0 2px, transparent 2px 6px) }
.patterns #fills i:nth-child(6n+2)::after { background-image: radial-gradient(var(--pattern) 1.3px, transparent 1.7px); background-size: 5px 5px }
.patterns #fills i:nth-child(6n+3)::after { background-image: repeating-linear-gradient(90deg, var(--pattern) 0 2px, transparent 2px 5px) }
.patterns #fills i:nth-child(6n+4)::after { background-image: repeating-linear-gradient(-45deg, var(--pattern) 0 2px, transparent 2px 6px), repeating-linear-gradient(45deg, var(--pattern) 0 2px, transparent 2px 6px) }
.patterns #fills i:nth-child(6n+5)::after { background-image: repeating-linear-gradient(45deg, var(--pattern) 0 2px, transparent 2px 6px) }
.patterns #fills i:nth-child(6n)::after { background-image: repeating-linear-gradient(0deg, var(--pattern) 0 2px, transparent 2px 5px) }

/* the coach: a guided first game. A paper note beside what it points at, a ring on the board, an outline on a control */
#coach { position: fixed; z-index: 7; width: min(340px, calc(100vw - 16px)); padding: 12px 14px 14px; border-radius: var(--r-1); box-shadow: var(--lift-3) }
#coach p { margin-bottom: 10px } #coach p:first-child { font: 700 var(--fs-1)/1.3 var(--sans); letter-spacing: var(--caps); text-transform: uppercase; color: var(--accent); margin-bottom: 4px } #coach p:first-child small { font: var(--fs-1) var(--sans); letter-spacing: 0; text-transform: none; color: var(--text-3) }
#coach p + p { font: 17px/1.45 var(--serif) } #coach .go > * { flex: 1 } #coach .quiet { flex: 0 1 auto }
/* in play the note heads the move panel and stays at its top while the rest scrolls, so it never lies on the board; only the offer floats */
#act #coach { position: sticky; z-index: 1; top: -14px; width: auto; margin: -2px 0 12px; box-shadow: var(--lift-1) }
#coach:focus { outline: none } #coach:focus-visible { outline: 3px solid var(--focus) }
#coach-ring { position: fixed; z-index: 1; width: 52px; height: 52px; border-radius: 50%; border: 3px solid #f6f8fb; box-shadow: 0 0 0 3px rgba(10, 18, 30, .7), 0 0 18px #cfd8e2; pointer-events: none; animation: coach 1.4s ease-in-out infinite }
.coached { outline: 3px solid #f6f8fb !important; outline-offset: 2px }
@keyframes coach { 50% { box-shadow: 0 0 0 3px rgba(10, 18, 30, .7), 0 0 26px 6px #cfd8e2 } }

/* an atlas board (a wide map): seats along the top, the move at the left */
@media (min-width: 821px) {
  .atlas #seats { left: 50%; top: calc(var(--bar-b, 66px) / var(--ui-scale) + 8px); transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); grid-auto-flow: column; gap: var(--sp-2) }
  .atlas .seat { padding: 7px 14px 7px 46px; min-width: 150px } .atlas .seat canvas { left: 9px; top: 9px; width: 28px; height: 28px } .atlas .seat small { display: none } .atlas .seat b { line-height: 28px } .atlas .seat dl { margin: 3px 0 0 -36px; gap: 12px } .atlas .seat.now { transform: none }
  .atlas #act { right: auto; left: 16px }
  .atlas #toast { top: 168px } .atlas .zoom { left: auto; right: 16px }
}
@media (max-height: 560px) and (min-width: 821px) { #seats { width: 176px } #act { width: 300px } h1 { font-size: 56px } .seat small { display: none } }
/* a wide screen: the zoom is a row at the foot of the seats' column, which never runs down onto it */
@media (min-width: 821px) {
  body:not(.atlas) .board-zoom { grid-auto-flow: column }
  body:not(.atlas):not(.side) #seats { max-height: calc((100vh - 150px) / var(--ui-scale)); overflow-y: auto; scrollbar-width: none; padding: 6px 10px 6px 0; width: 218px }
}

/* a phone: one strip on top, one tray below, the board has the rest. The tray folds to a handle with the main action still showing; sheets rise from the bottom edge */
.tray { display: none }
@media (max-width: 820px) {
  #seats { display: flex; gap: 6px; left: 8px; right: 8px; width: auto; transform: none; top: calc(var(--bar-b, calc(max(6px, env(safe-area-inset-top)) + 54px)) / var(--ui-scale) + 6px); overflow-x: auto; scrollbar-width: none }
  .seat { flex: 1 1 0; min-width: 58px; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; overflow: hidden }
  .seat.now { transform: none } .seat canvas { position: static; flex: none; width: 24px; height: 24px }
  .seat b { flex: 1 1 auto; min-width: 0; font-size: 17px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis } .seat small { display: none }
  .seat dl { flex: none; margin: 0 } .seat dl div + div, .seat dt { display: none } .seat dd { font-size: 15px; line-height: 1.1 }
  .zoom { left: auto; right: 8px; bottom: calc(var(--act, 290px) + 8px) } .board-zoom { grid-auto-flow: column } /* a row just above the tray: it never climbs onto the seats or the bar (shell p10) */
  #act { --px: 12px; --pb: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0; bottom: 0; width: auto; max-height: calc(56vh / var(--ui-scale)); overflow-y: auto; padding: 12px var(--px) var(--pb); border-radius: var(--r-3) var(--r-3) 0 0; border-bottom: 0 }
  #status { font-size: 17px; margin-bottom: var(--sp-2) } .pick { margin-bottom: var(--sp-2) }
  #round { font-size: var(--fs-2); line-height: 1.15; letter-spacing: 0 } #bar .mid { padding-bottom: 3px } /* a long round line takes two short lines, not three */
  #info { min-height: 1.4em; font-size: var(--fs-1) } #dice svg { width: 26px; height: 26px } #leaders { grid-template-columns: 1fr 1fr; font-size: var(--fs-1) }
  #toast { top: auto; bottom: calc(var(--act, 290px) + 12px); font-size: 15px; width: max-content }
  .shade { background: linear-gradient(180deg, rgba(var(--shade), .4) 0, rgba(var(--shade), .84) 24%, rgba(var(--shade), .95) 62%) }
  .title { padding: 26px 16px 60px; max-width: none }
  .menu #foot { left: 0; right: 0; bottom: 0; padding: 8px 16px; background: var(--ground); justify-content: center }
  .tray { display: block; width: calc(100% + 24px); height: var(--tap); margin: -12px -12px -8px; border: 0; background: none }
  .tray::before { content: ""; display: block; width: 48px; height: 4px; margin: 0 auto 14px; border-radius: 2px; background: var(--edge) } .shut .tray::before { background: var(--accent) }
  .shut:not(.side) #act :is(#news, #dice, #bag, #info, #hand, #trades, .pick, #amount, #leaders, .live-info, #send > p, .text) { display: none }
  .shut:not(.side) #status { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: var(--sp-2) }
  #sheet.tabbed { height: calc(90vh / var(--ui-scale)) }
  dialog, #sheet.wide, #sheet.end { width: calc(100vw / var(--ui-scale)); max-width: none; margin: auto 0 0; max-height: calc(90vh / var(--ui-scale)); padding: 18px 16px; border-radius: var(--r-3) var(--r-3) 0 0; border-width: 1px 0 0 } dialog > .go { margin: 0 -16px -18px; padding: 10px 16px max(14px, env(safe-area-inset-bottom)) !important } dialog .go { bottom: -18px }
  .end .ends { grid-template-columns: 1fr 1fr } .end .ends .main { grid-column: 1 / -1; grid-row: 1 } .hero canvas { width: 60px; height: 60px }
  #coach { padding: 10px 12px 12px } #coach p + p { font-size: 16px; line-height: 1.4; margin-bottom: var(--sp-2) } #coach .main, #coach .quiet { min-height: var(--tap) }
  #act #coach { top: -12px; margin: 0 0 10px }
}
/* a narrow phone: each seat chip puts its number under its name, so neither is cut to a letter (shell p10) */
@media (max-width: 400px) {
  body:not(.side) .seat { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 5px; row-gap: 0; align-items: center; padding: 3px 6px 3px 4px }
  body:not(.side) .seat canvas { grid-row: 1 / span 2; width: 22px; height: 22px }
  body:not(.side) .seat b { font-size: 15px; line-height: 1.15 } body:not(.side) .seat dl { grid-column: 2 } body:not(.side) .seat dd { font-size: 14px }
}
/* side: a phone on its side or a small window. The seats in a strip under the bar, the move panel a full-height column at the right,
   the board the rest; nothing that is pressed ever falls below the fold. Set by table.js (body.side), and after the rules above on purpose */
body.side { --side-w: min(340px, 42vw) }
body.side #bar { left: max(8px, env(safe-area-inset-left)); transform: none; width: calc((100vw - var(--side-w) - 28px) / var(--ui-scale)); max-width: 620px; padding-top: max(4px, env(safe-area-inset-top)) }
body.side #seats { display: flex; gap: 6px; left: max(8px, env(safe-area-inset-left)); right: calc(var(--side-w) + 20px); width: auto; max-width: none; transform: none; top: calc(var(--bar-b, calc(max(4px, env(safe-area-inset-top)) + 52px)) / var(--ui-scale) + 6px); overflow-x: auto; scrollbar-width: none }
body.side .seat { flex: 1 1 0; min-width: 58px; display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 4px; overflow: hidden }
body.side .seat.now { transform: none } body.side .seat canvas { position: static; flex: none; width: 24px; height: 24px }
body.side .seat b { flex: 1 1 auto; min-width: 0; font-size: 16px; line-height: 1.15; overflow: hidden; white-space: nowrap; text-overflow: ellipsis } body.side .seat small { display: none }
body.side .seat dl { flex: none; margin: 0 } body.side .seat dl div + div, body.side .seat dt { display: none } body.side .seat dd { font-size: 15px; line-height: 1.1 }
body.side #act { --px: 12px; --pb: 12px; top: max(8px, env(safe-area-inset-top)); bottom: max(8px, env(safe-area-inset-bottom)); right: max(8px, env(safe-area-inset-right)); left: auto; width: calc(var(--side-w) / var(--ui-scale)); max-height: none; padding: 10px var(--px) var(--pb); border-radius: var(--r-2); border-bottom: 1px solid var(--edge-soft) }
body.side #act #coach { top: -10px }

/**

 * filter, denied, address, offline, connect, other.

async function ask(r, prompt, signal, o = {}) {

  if (p.bridge) return bridgeAsk(r, key, prompt, signal, { kind, onStatus: o.onStatus }); // mcp hook: the player's own AI app answers, through the bridge they started
  if (!reachable(base)) throw fail("address", addressWrong(base));
  if (!key && !p.local && !p.custom) throw fail("key", `Give your ${p.name} key first: Game, How Capo reaches an AI.`);
  if (!model && p.shape !== "openai") throw fail("model", `Choose a model for ${p.name}.`);
  const fmt = p.tools && r.tools !== false && !r.plain?.[p.id] && kind !== "check" && formatOf(prompt), tool = fmt && toolOf(fmt);

  c.system = voiceNow(kind); // plugins hook: the prose style and tone the player chose, as a system message; wording only

      if (e.kind === "tools" && c.tool) { c.tool = null; r.plain = { ...r.plain, [p.id]: 1 }; continue; } // ask again for plain lines, and remember
      if (!["rate", "busy"].includes(e.kind) || tries >= 3) throw e;

  if (a.end === "length" && kind === "turn" && !/\bEND\b/.test(text)) throw fail("cut", "The reply was cut off before its end. Ask again, or tick Thinking model for a longer allowance.");

/** Check connection: lists the service's models (no tokens spent), then asks for one word. Returns { models, said, ms }. */

  const on = connected(route);
  return connectBox({ route, title: on ? undefined : "Move the world, or connect an AI", error: pending.error, again: viaAddress, connected: viaAddress, note: toast, lead: on ? [] : [rulesFirst()],

function advance() {
  if (calling) return toast("Capo is already waiting for the AI.");
  const typed = (sheet === "actions" && $("sheet").querySelector("textarea[aria-label='A new action']")?.value.trim()) || "";
  if (typed) { state.actions = [...(state.actions || []), typed]; save(); }
  const acts = state.actions || [], bad = crossesLine(acts);
  if (bad.length) return toast(`Action ${bad.join(", ")} is refused: nothing sexual involving minors.`);
  const to = jumpFrom(state.date, jump);

  pending = { prompt: worldPrompt(state, { name, neighbours: landNeighbours, across: seaNeighbours, size: (c) => held(c).length, geo: g, places: placesFor(state, g, [...world.provinces.keys()]), talk: talkLines(state, { name }), disputes: disputeLines() }, acts, to, auto), to, auto, actions: acts };
  // with no AI, only the first Advance in this browser asks; after that the rules move the world at once (ruling 151)

// one call to an AI at a time, which can be stopped; ask() gives up when nothing arrives for two minutes

async function call(prompt, kind = "turn") {

}
const stopCall = () => calling?.abort("stop");
async function viaAddress() {

}

  const r = readWorldReply(text, state, (c) => homes.has(c) || custom()?.code === c, pending.to, pending.auto, codeOf);
  if (!r.matched) { pending.error = `That reply is not for this turn: it must start with TURN: ${turnCode(state)}.`; open("actions"); return; }
  if (!r.events.length) { pending.error = `No event could be read${r.dropped.length ? `: ${r.dropped.slice(0, 3).join("; ")}` : ""}.`; open("actions"); return; }
  // moves the AI wrote for the player's country, beyond the orders given by card, are shown for a tick first

function settle(text) {

}
